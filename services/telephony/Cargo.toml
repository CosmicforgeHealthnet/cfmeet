[workspace]
members = [".", "migration"]

[package]
name = "telephony"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "telephony"
description = "CF Meet Telephony service: public-network execution (Telephony legs, SIP / media edge, provider interconnects, provider events, commands, bridges, unknown outcomes, reconciliation, failover)"

[lib]
name = "telephony"
path = "src/lib.rs"

[[bin]]
name = "telephony"
path = "src/main.rs"

[[bin]]
name = "telephony-admin"
path = "src/bin/telephony-admin.rs"

[dependencies]
telephony-migration = { path = "migration" }
# Shared internal service authentication protocol (packages/, never another service).
cf-service-auth = { path = "../../packages/service-auth", features = ["client"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "postgres-array"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
subtle = "2.6"
zeroize = "1.8"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
# SIP / media edge control plane (Asterisk ARI: REST over HTTP + event WebSocket),
# confined to src/sip/. rustls only, no redirects.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
