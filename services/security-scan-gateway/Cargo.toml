[package]
name = "security-scan-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "CosmicForge shared security scan gateway: authenticated, per-product, resource-bounded malware scanning in front of an EXISTING ClamAV engine. Loads no signatures and stores no files."

# Stand-alone workspace (like every deployable service here).
[workspace]

[lib]
name = "security_scan_gateway"
path = "src/lib.rs"

[[bin]]
name = "security-scan-gateway"
path = "src/main.rs"

[[bin]]
name = "security-scan-gateway-keygen"
path = "src/bin/keygen.rs"

[dependencies]
cf-service-auth = { path = "../../packages/service-auth" }
cf-scan-gateway-contract = { path = "../../packages/scan-gateway-contract" }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
http = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
