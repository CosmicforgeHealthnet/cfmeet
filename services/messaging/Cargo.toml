[workspace]
members = [".", "migration"]

[package]
name = "messaging"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "messaging"
description = "CF Meet Messaging: the Unified Messaging backend foundation — conversations with persisted PRIVATE_E2EE / MANAGED security profiles, Messaging devices and their public MLS material, the key-transparency log; authorization through Platform Access"

[lib]
name = "messaging"
path = "src/lib.rs"

[[bin]]
name = "messaging"
path = "src/main.rs"

[dependencies]
messaging-migration = { path = "migration" }
# Shared internal service authentication protocol (packages/, never another service).
cf-service-auth = { path = "../../packages/service-auth", features = ["client"] }
# PUBLIC half of the Messaging cryptographic core only: KeyPackage validation, device
# binding formats, transparency proofs. The `client` feature (private-key generation) is
# never enabled here (tests/architecture.rs).
cf-messaging-crypto = { path = "../../packages/messaging-crypto" }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "postgres-array"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
secrecy = "0.10"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
async-trait = "0.1"
zeroize = "1.8"

[dev-dependencies]
# Tests act as client devices: they generate real MLS KeyPackages (never the server).
cf-messaging-crypto = { path = "../../packages/messaging-crypto", features = ["client"] }
jsonschema = { version = "0.58", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.42", features = ["process"] }
