[workspace]
members = [".", "migration"]

[package]
name = "messaging"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
default-run = "messaging"
description = "CF Meet Messaging: the Unified Messaging backend foundation — conversations with persisted PRIVATE_E2EE / MANAGED security profiles, Messaging devices and their public MLS material, the key-transparency log; authorization through Platform Access"

[lib]
name = "messaging"
path = "src/lib.rs"

[[bin]]
name = "messaging"
path = "src/main.rs"

[[bin]]
name = "messaging-admin"
path = "src/bin/messaging-admin.rs"

[dependencies]
messaging-migration = { path = "migration" }
# Shared internal service authentication protocol (packages/, never another service).
cf-service-auth = { path = "../../packages/service-auth", features = ["client"] }
# PUBLIC half of the Messaging cryptographic core only: KeyPackage validation, device
# binding formats, transparency proofs. The `client` feature (private-key generation) is
# never enabled here (tests/architecture.rs).
cf-messaging-crypto = { path = "../../packages/messaging-crypto" }
# Protected attachment storage (private S3-compatible bucket, signed single-object
# uploads / reads issued only after Messaging authorized the caller).
cf-object-storage = { path = "../../packages/object-storage" }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "postgres-array"] }
axum = { version = "0.7", default-features = false, features = ["http1", "http2", "json", "tokio", "query", "matched-path", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Self-hosted realtime broker / ephemeral presence (pub/sub and TTL sets only; never the
# message store).
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
secrecy = "0.10"
sha2 = "0.10"
# Signs key-transparency tree heads (Part V G.5) with a SEPARATE server key (§142); the same
# audited RustCrypto implementation packages/service-auth uses. Verification lives in
# packages/messaging-crypto (public half).
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize"] }
hex = "0.4"
rand = "0.8"
base64 = "0.22"
async-trait = "0.1"
zeroize = "1.8"
# Seals MANAGED message text at rest (XChaCha20-Poly1305; RustCrypto, already in the
# OpenMLS provider graph). Never used for PRIVATE_E2EE content.
chacha20poly1305 = "0.10"
# Push adapters (src/realtime/push_adapters.rs), all already in the dependency graph:
# ES256 provider / VAPID tokens and Web Push (RFC 8291) ECDH with RustCrypto, RS256 FCM
# service-account assertions with ring (constant-time RSA; never the `rsa` crate).
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "pem", "std"] }
aes-gcm = "0.10"
hmac = "0.12"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }

[dev-dependencies]
# Tests act as client devices: they generate real MLS KeyPackages (never the server).
cf-messaging-crypto = { path = "../../packages/messaging-crypto", features = ["client"] }
jsonschema = { version = "0.58", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.42", features = ["process"] }
# A real WebSocket client for the realtime gateway tests (same tungstenite as axum).
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
