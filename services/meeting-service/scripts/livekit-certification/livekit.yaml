# Local self-hosted LiveKit for meeting-service Part E certification.
# NOT a production configuration (dev key, loopback only).
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  cfmeet-cert-key: cfmeet-local-certification-secret-0123456789
webhook:
  api_key: cfmeet-cert-key
  urls:
    - http://127.0.0.1:18089/internal/rtc/livekit/webhook
room:
  auto_create: false
  empty_timeout: 300
logging:
  level: info
