[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "migration"

[lib]
name = "migration"
path = "src/lib.rs"

[[bin]]
name = "migration"
path = "src/main.rs"

[[bin]]
name = "test_connection"
path = "test_connection.rs"

[dependencies]
cf-migration-guard = { path = "../../../packages/migration-guard" }
async-std = { version = "1.12", features = ["attributes", "tokio1"] }
async-trait = "0.1"
sea-orm-migration = { version = "1.1.0", features = ["sqlx-postgres", "runtime-async-std-rustls", "with-uuid", "with-chrono", "with-json"] }
dotenvy = "0.15"

[[bin]]
name = "account-communications-migration"
path = "src/communications-main.rs"

[[bin]]
name = "account-security-migration"
path = "src/account-security-main.rs"

[[bin]]
name = "meetings-calendar-migration"
path = "src/meetings-calendar-main.rs"

[[bin]]
name = "profile-notifications-migration"
path = "src/profile-notifications-main.rs"

[[bin]]
name = "account-hardening-migration"
path = "src/account-hardening-main.rs"

[[bin]]
name = "organization-integration-migration"
path = "src/organization-integration-main.rs"

[[bin]]
name = "lifecycle-delivery-migration"
path = "src/lifecycle-delivery-main.rs"
