[workspace]
members = [".", "migration"]

[package]
name = "admin-bridge"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "admin-bridge"
description = "CF Meet Admin Bridge (ADR 0068): the only doorway from the CosmicForge central admin (HQ) into CF Meet. Authenticates HQ, authorizes staff against a signed access policy, calls the owning services with CF Meet service auth, writes a hash-chained audit and keeps small read summaries. Owns no business data and never reads end-to-end encrypted content"

[lib]
name = "admin_bridge"
path = "src/lib.rs"

[[bin]]
name = "admin-bridge"
path = "src/main.rs"

[[bin]]
name = "admin-bridge-admin"
path = "src/bin/admin-bridge-admin.rs"

[[bin]]
name = "admin-bridge-contract"
path = "src/bin/admin-bridge-contract.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
hmac = "0.12"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize"] }
admin-bridge-migration = { path = "migration" }
cf-service-auth = { path = "../../packages/service-auth", features = ["client"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"
x509-parser = "0.16"
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
async-trait = "0.1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
dotenvy = "0.15"
anyhow = "1.0"
secrecy = "0.10"
zeroize = "1.8"
rand = "0.8"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"
hyper = { version = "1", features = ["client", "http1"] }
