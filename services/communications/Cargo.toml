[workspace]
members = [".", "migration"]

[package]
name = "communications"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "communications"

[dependencies]
communications-migration = { path = "migration" }
cf-service-auth = { path = "../../packages/service-auth", features = ["client"] }
cf-communications-policy = { path = "../../packages/communications-policy" }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query", "matched-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
secrecy = "0.10"
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

