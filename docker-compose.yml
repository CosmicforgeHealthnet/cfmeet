# =============================================================================
# CF Meet — root local-development orchestration
#
# Dependencies only (default):
#   docker compose up -d                 # postgres, redis, livekit
#
# Full stack (also builds services/meeting-service/Dockerfile and runs the apps/web dev server):
#   docker compose --profile app up -d --build
#
# All ports are bound to 127.0.0.1 so nothing is exposed beyond this machine.
# This file is for local development only; it does not describe production.
# services/meeting-service/docker-compose.yml is kept for meeting-service-only workflows.
# LiveKit dev config: infra/livekit/. More on local Docker usage: infra/docker/README.md.
# =============================================================================

name: cfmeet

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-cosmicforge_rtc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:50000-50100:50000-50100/udp"

  # ---------------------------------------------------------------------------
  # Applications (opt-in with --profile app)
  # ---------------------------------------------------------------------------
  meeting-service:
    profiles: ["app"]
    build:
      context: ./services/meeting-service
      dockerfile: Dockerfile
    env_file:
      - ./services/meeting-service/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-cosmicforge_rtc}
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "./migration up && ./server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    volumes:
      - ./apps/web:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - meeting-service

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
