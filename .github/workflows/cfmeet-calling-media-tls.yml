name: Add private Calling LiveKit TLS upstream

# Adds only port 8446 inside an existing internal TLS proxy. No host port,
# no changes to the public Nginx and no Meeting container restart.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-calling-media-tls.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: cfmeet-calling-media-tls
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Configure internal LiveKit HTTPS and WSS routing
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          CFG=/opt/cfmeet-core/tls-proxy/nginx.conf
          BAK=/opt/cfmeet-core/tls-proxy/nginx.conf.pre-calling-livekit
          test -s "$CFG"
          test "$(docker inspect -f '{{.State.Running}}' lk-server)" = true
          test "$(docker inspect -f '{{.State.Running}}' cfmeet-core-tls)" = true
          cp -p "$CFG" "$BAK"
          python3 - "$CFG" <<'PY'
          import pathlib,re,sys
          path=pathlib.Path(sys.argv[1])
          s=path.read_text()
          if re.search(r'^\s*listen 8446 ssl;',s,re.M):
              print("LIVEKIT_UPSTREAM_ALREADY_CONFIGURED: yes")
          else:
              assert s.rstrip().endswith('}'),"Unexpected Nginx block structure"
              block='''
            server {
              listen 8446 ssl;
              server_name api.cfmeet.com;
              location / {
                set $peer lk-server:7880;
                proxy_pass http://$peer$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 3600;
              }
            }
          '''
              i=s.rfind('}')
              path.write_text(s[:i]+block+s[i:])
              print("LIVEKIT_UPSTREAM_CONFIGURED: yes")
          PY
          recover() {
            rc=$?
            trap - ERR
            cp -p "$BAK" "$CFG"
            docker exec cfmeet-core-tls nginx -s reload >/dev/null 2>&1 || true
            echo "PROXY_CONFIG_RESTORED: yes"
            exit "$rc"
          }
          trap recover ERR
          docker exec cfmeet-core-tls nginx -t >/dev/null
          docker exec cfmeet-core-tls nginx -s reload >/dev/null
          # The proxy's cert is verified by curl; 404 at LiveKit "/" is fine.
          ok=0
          for i in $(seq 1 16); do
            if docker run --rm --network cfmeet-core-private curlimages/curl:8.12.1 \
              -sS --max-time 5 https://api.cfmeet.com:8446/ >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo "Private LiveKit TLS unreachable"; exit 1; }
          for port in 8443 8444 8445; do
            path=/ready
            if test "$port" = 8445; then path=/health; fi
            docker run --rm --network cfmeet-core-private curlimages/curl:8.12.1 \
              -fsS --max-time 6 "https://api.cfmeet.com:$port$path" >/dev/null
          done
          trap - ERR
          echo "PRIVATE_LIVEKIT_TLS: VERIFIED"
          echo "PLATFORM_MESSAGING_CALLING_TLS: ALL_VERIFIED"
          echo "PUBLIC_HOST_PORTS_ADDED: NONE"
          REMOTE
