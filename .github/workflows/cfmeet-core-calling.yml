name: Deploy CF Meet Calling privately

# Dark rollout only: own migrations, private HTTPS, no host ports.
# Both app and PSTN calling are disabled until full end-to-end certification.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-core-calling.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfmeet-core-calling
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Migrate and start private Calling
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          ROOT=/opt/cfmeet-core
          SECRETS="$ROOT/secrets"
          NET=cfmeet-core-private
          IMAGE=ghcr.io/cosmicforgehealthnet/cfmeet-calling:884776b0757109d4ccb84ad25ada7c1a0f5af336
          CONTAINER=cfmeet-calling
          SIGNING="$SECRETS/calling-service-auth.pem"
          SIGNAL="$SECRETS/calling-signaling.key"
          TRUST="$SECRETS/calling-trust.json"
          test -s "$SECRETS/calling-migrator.password" &&
            test -s "$SECRETS/calling-runtime.password" &&
            test -s "$SIGNING" && test -s "$SIGNAL" &&
            docker image inspect "$IMAGE" >/dev/null &&
            docker network inspect "$NET" >/dev/null
          if test ! -s "$TRUST"; then
            printf '%s\n' '{"bundle_version":1,"receiver":"cfmeet.calling","runtime_environment":"production","trusted_issuers":[]}' > "$TRUST"
          fi
          chown 10001:10001 "$SIGNING" "$SIGNAL" "$TRUST"
          chmod 0400 "$SIGNING" "$SIGNAL" "$TRUST"

          PW_MIGRATOR="$(cat "$SECRETS/calling-migrator.password")"
          PW_RUNTIME="$(cat "$SECRETS/calling-runtime.password")"
          ENV_FILE="$ROOT/calling.runtime.env"
          cat > "$ENV_FILE" <<ENV
          DATABASE_URL=postgres://calling:$PW_RUNTIME@cfmeet-core-db:5432/cfmeet_calling
          CALLING_BIND_ADDRESS=0.0.0.0:8090
          CF_RUNTIME_ENVIRONMENT=production
          CF_SERVICE_AUTH_KEY_ID=calling-production-1
          CF_SERVICE_AUTH_PRIVATE_KEY_FILE=/run/secrets/calling-auth.pem
          CF_SERVICE_TRUST_BUNDLE_FILE=/run/secrets/calling-trust.json
          CF_PLATFORM_ACCESS_BASE_URL=https://api.cfmeet.com:8443
          CALLING_SIGNALING_SIGNING_KEY_FILE=/run/secrets/calling-signaling.key
          CALLING_MEDIA_PROVIDER=none
          CALLING_NEW_CALLS_ENABLED=false
          CALLING_APP_CALLING_ENABLED=false
          CALLING_PUBLIC_OUTBOUND_ENABLED=false
          CALLING_PUBLIC_INBOUND_ENABLED=false
          CALLING_CALLBACK_RELAY_ENABLED=false
          ENTERPRISE_CALLING_ENABLED=false
          LOG_FORMAT=json
          ENV
          chmod 0600 "$ENV_FILE"

          docker run --rm --network "$NET" \
            -e "DATABASE_URL=postgres://calling_migrator:$PW_MIGRATOR@cfmeet-core-db:5432/cfmeet_calling" \
            --entrypoint /app/calling-migration "$IMAGE" up
          unset PW_RUNTIME PW_MIGRATOR

          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" = true ||
              { echo 'Existing Calling container stopped'; exit 1; }
            test "$(docker inspect --format '{{.Config.Image}}' "$CONTAINER")" = "$IMAGE" ||
              { echo 'Unexpected Calling image'; exit 1; }
          else
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              --network "$NET" --env-file "$ENV_FILE" \
              --mount type=bind,src="$SIGNING",dst=/run/secrets/calling-auth.pem,readonly \
              --mount type=bind,src="$SIGNAL",dst=/run/secrets/calling-signaling.key,readonly \
              --mount type=bind,src="$TRUST",dst=/run/secrets/calling-trust.json,readonly \
              "$IMAGE" >/dev/null
          fi
          ports="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$CONTAINER")"
          test "$ports" = 'null' || test "$ports" = '{}' ||
            { echo 'Unexpected Calling public port'; exit 1; }
          passed=0
          for i in $(seq 1 30); do
            if docker run --rm --network "$NET" curlimages/curl:8.12.1 \
              -fsS --max-time 6 https://api.cfmeet.com:8445/health >/dev/null 2>&1; then
              passed=1
              break
            fi
            sleep 2
          done
          if test "$passed" != 1; then
            echo 'Calling health failed; activation remains disabled'
            docker logs --tail 25 "$CONTAINER" 2>&1 | sed -E 's@(postgres(ql)?://)[^ ]+@\1[REDACTED]@g' || true
            exit 1
          fi
          echo "CALLING_PRIVATE_HTTPS_HEALTH: yes"
          echo "CALLING_NEW_CALLS_ENABLED: false"
          echo "CALLING_MEDIA_PROVIDER: none"
          echo "PUBLIC_HOST_PORTS: none"
          echo "MEETING_SERVICE_RESTARTED: no"
          REMOTE
