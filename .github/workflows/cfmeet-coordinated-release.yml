name: CF Meet coordinated production release

# The single production release path for every CF Meet backend service (Meeting Service,
# Platform Access, Organizations, Messaging, Calling, Communications, Numbering, Privacy
# Relay, SMS Gateway, Telephony, Developer Platform, API Gateway; the shared scan gateway
# is upgraded only where it is already deployed). Reusable automatic release or manual
# dispatch, main only, and the dispatched SHA must be the main head whose push CI is green. Images are built (or reused)
# for that SHA, their revision label is verified, and they are transferred to the VPS over
# SSH; infra/calling/production/coordinated_release.py then performs the operation there.
# `certify` is the read-only live-production certification: it changes nothing on the VPS,
# certifies whatever revisions are deployed (verify stays strictly same-SHA), probes the
# public API from the runner and writes the verdict (certification_report.py).
# Runbook: docs/operations/coordinated-production-release.md.
on:
  workflow_call:
    inputs:
      operation:
        description: Production operation (automatic caller always selects release)
        required: true
        type: string
      release_sha:
        description: Full SHA of the main head
        required: true
        type: string
      confirm:
        required: false
        type: string
        default: ''
      request_id:
        required: false
        type: string
        default: ''
      reason_code:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation (read the runbook first; activation steps are separate owner approvals)'
        type: choice
        required: true
        default: inspect
        options: [inspect, backup, provision, release, verify, rollback, certify, activate-provisioning, activate-org-events, activate-organization-bindings, org-cutover-export, org-cutover-import, org-cutover-shadow, org-cutover-authoritative, org-cutover-first-activation, activate-enterprise-calling, activate-developer-platform, activate-gateway-routing, activate-first-party-features, activate-personal-encryption, activate-web-push, activate-web-origins, activate-gateway-docs, activate-edge-rate-limits, activate-token-ceiling, activate-service-key-publish, activate-service-key-switch, activate-service-key-retire, activate-developer-console, activate-developer-webhooks, activate-gateway-families, activate-usage-export, activate-resend-email, activate-production-access-review, activate-meeting-notice-preferences, activate-public-internal-denial, activate-client-address-limits, activate-account-privacy, activate-database-pools, activate-notifications-owners, activate-notifications-routing, activate-notifications-relay, activate-messaging-publications, activate-organizations-publications, activate-communications-publications, activate-developer-publications, activate-meeting-publications, activate-calling-publications, activate-notifications-push, activate-messaging-push-mirror, activate-calling-push, activate-critical-lane, activate-preference-copy, activate-preference-authority, activate-notifications-email, activate-notification-fence, activate-meeting-in-app-notices, activate-platform-users, activate-platform-user-tokens, activate-partner-chat, activate-partner-calls, activate-gateway-calling-edge, activate-partner-push, activate-platform-meetings, activate-oauth-apps, activate-oauth, activate-delegated-apps, activate-app-installs, activate-app-events, activate-app-directory, activate-in-meeting-apps, developer-acceptance, organization-acceptance, diagnose, email-acceptance, developer-access-review, notifications-acceptance, deploy-monitoring, platform-acceptance]
      release_sha:
        description: 'Full 40-character commit SHA; must equal the main head this run is dispatched on'
        type: string
        required: true
      confirm:
        description: 'Owner gate confirmations for cutover steps only (lowercase words, comma separated); developer-access-review: list | get | review | approve | reject; email-acceptance: otp; activate-service-key-*: service=<name>; activate-gateway-calling-edge: owner-approved-calling-edge; activate-oauth-apps: no-reviewers-yet (only while CFMEET_APP_REVIEWERS is empty); activate-notifications-routing: <category>-<channel>-<mode> or user-facing-<in-app|push>-<mode>; activate-meeting-in-app-notices: enable | disable'
        type: string
        required: false
        default: ''
      request_id:
        description: 'developer-access-review only: the production-access request id (UUID)'
        type: string
        required: false
        default: ''
      reason_code:
        description: 'developer-access-review reject only: safe reason code (e.g. NOT_ELIGIBLE)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  gate:
    name: Gate (main, exact SHA, green CI)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main and the dispatched SHA
        env:
          OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "::error::Production operations run from main only"; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::release_sha must be a full lowercase SHA"; exit 1; }
          # inspect and diagnose are read-only and rollback restores the recorded previous containers;
          # every other operation acts on exactly the main head it was dispatched on
          # (certify uses it as the reference for revision lineage and source comparison).
          if [[ "$OPERATION" != inspect && "$OPERATION" != diagnose && "$OPERATION" != rollback && "$RELEASE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::release_sha ($RELEASE_SHA) must equal the main head ($GITHUB_SHA)"; exit 1
          fi

      - name: Require green main CI for this SHA
        # Read-only operations (inspect, diagnose, certify) and rollback do not wait for CI.
        if: inputs.operation != 'inspect' && inputs.operation != 'diagnose' && inputs.operation != 'rollback' && inputs.operation != 'certify'
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.RELEASE_SHA;
            // Service CI and the cross-service certifications of runbook §0 P1. A workflow
            // that ran on this push must be green; a path-filtered one that did not run must
            // have its latest completed main run green (its inputs did not change).
            const required = [
              'backend.yml', 'platform-access.yml', 'organizations.yml', 'notifications.yml', 'messaging.yml', 'calling.yml',
              'communications-hub.yml', 'developer-platform.yml', 'api-gateway.yml', 'security-scan-gateway.yml',
              'contracts.yml', 'service-boundaries.yml', 'dependency-security.yml', 'migration-guard.yml',
              'certification.yml', 'unified-messaging-e2e.yml', 'enterprise-calling-certification.yml'
            ];
            // Owner decision 2026-11-13: external-telecom features (PSTN/SIP carrier, number
            // provisioning, SMS, phone OTP, telecom Privacy Relay) stay disabled until provider
            // credentials exist. Their CI and certifications still run on every push and are
            // reported here, but they are advisory: they never block a first-party release.
            // The backup drill is advisory too (owner decision: no backup prerequisite).
            const advisory = new Set([
              'telephony.yml', 'telephony-sip-certification.yml', 'sms-gateway.yml', 'numbering.yml',
              'privacy-relay.yml', 'communications-e2e.yml', 'backup-restore-drill.yml', 'cfmeet-offsite-backup.yml'
            ]);
            const ignored = new Set(['Deploy Backend', 'CF Meet coordinated production release']);
            const deadline = Date.now() + 70 * 60 * 1000;
            let stable = 0;
            while (Date.now() < deadline) {
              const { data: main } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              if (main.commit.sha !== sha) {
                core.setFailed('Main advanced past ' + sha + '; dispatch again on the new head');
                return;
              }
              const all = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha: sha, event: 'push', per_page: 100
              });
              const pushed = all.filter(r => r.head_sha === sha && r.event === 'push' &&
                r.head_branch === 'main' && !ignored.has(r.name));
              // Gate only the named backend/contract/security CI checks; unrelated
              // frontend or Vercel workflows are intentionally non-blocking.
              // The automatic caller itself is also excluded to prevent a deadlock.
              const runs = pushed.filter(r => required.includes(r.path.split('/').pop()));
              for (const r of pushed.filter(r => advisory.has(r.path.split('/').pop()) && r.status === 'completed' &&
                  !['success', 'skipped', 'neutral'].includes(r.conclusion))) {
                core.warning('Advisory (external telecom / backup, not blocking): ' + r.name + ': ' + r.conclusion);
              }
              const bad = runs.filter(r => r.status === 'completed' &&
                !['success', 'skipped', 'neutral'].includes(r.conclusion));
              if (bad.length) {
                core.setFailed('Main CI failed: ' + bad.map(r => r.name + ': ' + r.conclusion).join(', '));
                return;
              }
              const pending = runs.filter(r => r.status !== 'completed');
              if (pending.length) {
                stable = 0;
                core.info('Waiting for: ' + pending.map(r => r.name).join(', '));
              } else if (++stable >= 2) {
                // A second clean inventory: late-registered push workflows are included.
                const ran = new Set(runs.map(r => r.path.split('/').pop()));
                for (const file of required.filter(f => !ran.has(f))) {
                  const { data } = await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: file, branch: 'main', status: 'completed', per_page: 1
                  });
                  const last = data.workflow_runs[0];
                  if (!last || last.conclusion !== 'success') {
                    core.setFailed(file + ' did not run for ' + sha + ' and its latest main run is not green');
                    return;
                  }
                  core.info(file + ': not triggered by this push; latest main run ' + last.html_url + ' succeeded');
                }
                core.info('All ' + runs.length + ' main push workflows green for ' + sha);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 30000));
            }
            core.setFailed('Timed out waiting for green main CI for ' + sha);

  images:
    name: Build or reuse release images
    # Image preparation overlaps the main CI gate. The production job itself
    # still requires both gate and images to succeed before touching the VPS.
    if: inputs.operation == 'release'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/cfmeet-core-images.yml

  production:
    name: ${{ inputs.operation }} on the production VPS
    needs: [gate, images]
    if: ${{ always() && needs.gate.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 180
    # One production change at a time: shared with deploy-backend.yml's deploy job and every
    # mutating cfmeet-calling-production.yml operation. A running release is never cancelled.
    # (The CI gate and image builds run before the lock is taken.)
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # certify compares running revisions with the main head: full history.
          # Activations prove their images equal the deployed release (activation_base.py).
          # A release replaces only the images whose build inputs changed (release_scope.py).
          fetch-depth: ${{ (inputs.operation == 'certify' || inputs.operation == 'release' || startsWith(inputs.operation, 'activate-') || startsWith(inputs.operation, 'org-cutover-')) && '0' || '1' }}

      - name: Offline release tests (resource gate, grants, order, rollback, secrecy)
        run: python3 -m unittest discover -s infra/calling/production -p 'test_*.py' -v

      - name: Configure existing production SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts

      - name: Authenticate for release images
        if: inputs.operation == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify, record and transfer the exact release images
        if: inputs.operation == 'release'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12)
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # The VPS module resolves images under this owner; refuse any other.
          [[ "$owner" == cosmicforgehealthnet ]]
          [[ "$IMAGE_SHA" == "$GITHUB_SHA" ]]
          available=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "df -k --output=avail / | tail -n1")
          [[ "$available" =~ ^[[:space:]]*[0-9]+$ ]] && (( available > 10485760 )) || { echo "::error::Less than 10 GiB free on the VPS"; exit 1; }
          manifest="$RUNNER_TEMP/registry.json"
          printf '{}' > "$manifest"
          for service in platform-access organizations notifications messaging calling communications numbering privacy-relay sms-gateway telephony meeting-service developer-platform api-gateway security-scan-gateway; do
            image="ghcr.io/$owner/cfmeet-$service:$IMAGE_SHA"
            docker pull -q "$image"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            [[ "$revision" == "$IMAGE_SHA" ]] || { echo "::error::$service image revision $revision is not $IMAGE_SHA"; exit 1; }
            docker image inspect "$image" | python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); v=json.loads(p.read_text()); m=json.load(sys.stdin)[0]; v[sys.argv[2]]={"imageId":m["Id"],"registryDigests":m.get("RepoDigests",[]),"revision":m["Config"]["Labels"]["org.opencontainers.image.revision"]}; p.write_text(json.dumps(v,indent=1,sort_keys=True))' "$manifest" "$service"
            expected_id=$(docker image inspect --format '{{.Id}}' "$image")
            cached_id=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "docker image inspect --format '{{.Id}}' '$image' 2>/dev/null" || true)
            if [[ "$cached_id" == "$expected_id" ]]; then
              echo "$service: exact image already on the VPS"
            else
              docker save "$image" | gzip -1 | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'gzip -dc | docker load -q'
              loaded_id=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "docker image inspect --format '{{.Id}}' '$image'")
              [[ "$loaded_id" == "$expected_id" ]] || { echo "::error::$service image id differs after transfer"; exit 1; }
            fi
          done
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p /opt/cfmeet-core/coordinated; cat > '/opt/cfmeet-core/coordinated/registry-$IMAGE_SHA.json'" < "$manifest"
          { echo '### Release images'; echo '```json'; cat "$manifest"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Release scope (replace only images whose build inputs changed)
        # Services whose image build inputs did not change since the latest completed release
        # keep their running container; the VPS re-checks that each runs exactly the image
        # recorded for that release before keeping it.
        if: inputs.operation == 'release'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          base=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" python3 - <<'PY'
          import json, os
          path = '/opt/cfmeet-core/coordinated/journal.json'
          journal = json.load(open(path)) if os.path.exists(path) else []
          done = [e['sha'] for e in journal if e['operation'] == 'release' and e['status'] == 'done']
          print(done[-1] if done else '')
          PY
          )
          [[ -z "$base" || "$base" =~ ^[a-f0-9]{40}$ ]]
          cd infra/calling/production
          python3 release_scope.py "$GITHUB_WORKSPACE" "$RELEASE_SHA" "${base:--}" release-scope.json
          { echo '### Release scope'; echo '```json'; python3 -c 'import json; d=json.load(open("release-scope.json")); print(json.dumps({k: d[k] for k in ("base", "changed", "unchanged", "reason")}, indent=1))'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Activation base (images of the dispatched head equal the deployed release)
        # Activations change flags, trust bundles and routing, never images. When the head has
        # no completed release of its own, prove that no build input of any of the 13 images
        # changed since the latest completed release; the VPS re-checks the running images.
        if: startsWith(inputs.operation, 'activate-') || startsWith(inputs.operation, 'org-cutover-')
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          base=$(ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" python3 - <<'PY'
          import json
          journal = json.load(open('/opt/cfmeet-core/coordinated/journal.json'))
          done = [e['sha'] for e in journal if e['operation'] == 'release' and e['status'] == 'done']
          print(done[-1] if done else '')
          PY
          )
          [[ "$base" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::No completed coordinated release is recorded"; exit 1; }
          cd infra/calling/production
          python3 activation_base.py "$GITHUB_WORKSPACE" "$RELEASE_SHA" "$base" activation-base.json
          { echo '### Activation base'; echo '```json'; python3 -c 'import json; d=json.load(open("activation-base.json")); d.pop("inputs"); print(json.dumps(d, indent=1))'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the Resend credentials on the VPS and install the acceptance recipient (never printed)
        # Owner decision (2026-11-16): the dedicated CF Meet Resend API key and the webhook
        # signing secret are stored ONLY on the production VPS, as root-owned files of the
        # existing secret store. Nothing is read from GitHub secrets and nothing is copied: this
        # step proves over SSH that each file exists, is a regular file owned by root with no
        # group/other access, and holds a value of the expected form. Values never leave the
        # VPS and are never printed (format checks run there with grep -q). email_operations.py
        # mounts the same files read-only into the Meeting Service. The acceptance recipient (a
        # controlled inbox; default Resend's test inbox) stays a non-secret variable.
        if: inputs.operation == 'activate-resend-email' || inputs.operation == 'email-acceptance'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ACCEPTANCE_RECIPIENT: ${{ vars.CFMEET_EMAIL_ACCEPTANCE_RECIPIENT }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          dir=/opt/cfmeet-core/secrets
          [[ -d "$dir" && ! -L "$dir" ]] || { echo "::error::$dir is missing"; exit 1; }
          read -r downer dmode < <(stat -c '%u %a' "$dir")
          [[ "$downer" == 0 ]] || { echo "::error::$dir is not owned by root"; exit 1; }
          (( (8#$dmode & 8#022) == 0 )) || { echo "::error::$dir is writable by group or others (mode $dmode)"; exit 1; }
          check() {  # file name, value pattern, required|optional
            local f="$dir/$1" owner mode
            if [[ ! -e "$f" && ! -L "$f" ]]; then
              [[ "$3" == required ]] && { echo "::error::$f is missing on the VPS"; exit 1; }
              echo "$1: absent"; return 0
            fi
            [[ -f "$f" && ! -L "$f" ]] || { echo "::error::$f is not a regular file"; exit 1; }
            read -r owner mode < <(stat -c '%u %a' "$f")
            [[ "$owner" == 0 ]] || { echo "::error::$f is not owned by root"; exit 1; }
            (( (8#$mode & 8#077) == 0 )) || { echo "::error::$f is accessible to group or others (mode $mode)"; exit 1; }
            [[ "$(wc -l < "$f")" -le 1 ]] || { echo "::error::$f must hold a single value"; exit 1; }
            head -c 512 "$f" | tr -d '\r\n' | grep -Eq "$2" \
              || { echo "::error::$f does not hold a value of the expected form"; exit 1; }
            echo "$1: present, root-owned, mode $mode, form valid"
          }
          check resend-api-key '^re_[A-Za-z0-9_]{8,200}$' required
          check resend-webhook-secret '^whsec_[A-Za-z0-9+/=]{16,200}$' optional
          REMOTE
          if [[ -n "$ACCEPTANCE_RECIPIENT" ]]; then
            [[ "$ACCEPTANCE_RECIPIENT" =~ ^[A-Za-z0-9._%+-]{1,64}@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]] || { echo "::error::CFMEET_EMAIL_ACCEPTANCE_RECIPIENT is not an address"; exit 1; }
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p /opt/cfmeet-core/coordinated; cat > /opt/cfmeet-core/coordinated/email-acceptance-recipient" <<< "$ACCEPTANCE_RECIPIENT"
          fi

      - name: Production-access reviewers and the review command (named reviewers only)
        # Reviewers are the owner's explicit list (variable CFMEET_PRODUCTION_ACCESS_REVIEWERS:
        # github-<login>=<CF Meet user id>, comma separated). The operator of a review is the
        # GitHub account that dispatched it; the VPS refuses anyone not on the list.
        if: inputs.operation == 'activate-production-access-review' || inputs.operation == 'developer-access-review'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OPERATION: ${{ inputs.operation }}
          REVIEWERS: ${{ vars.CFMEET_PRODUCTION_ACCESS_REVIEWERS }}
          ACTOR: ${{ github.actor }}
          COMMAND: ${{ inputs.confirm }}
          REQUEST_ID: ${{ inputs.request_id }}
          REASON_CODE: ${{ inputs.reason_code }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          [[ -n "$REVIEWERS" ]] || { echo "::error::Set the CFMEET_PRODUCTION_ACCESS_REVIEWERS variable (github-<login>=<CF Meet user id>, ...)"; exit 1; }
          [[ "$REVIEWERS" =~ ^[A-Za-z0-9=,\ -]{1,2000}$ ]] || { echo "::error::CFMEET_PRODUCTION_ACCESS_REVIEWERS has unexpected characters"; exit 1; }
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; cat > /opt/cfmeet-core/coordinated/production-reviewers" <<< "$REVIEWERS"
          if [[ "$OPERATION" == developer-access-review ]]; then
            [[ "$COMMAND" =~ ^(list|get|review|approve|reject)$ ]] || { echo "::error::confirm must be list, get, review, approve or reject"; exit 1; }
            [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::request_id must be a lowercase UUID"; exit 1; }
            [[ -z "$REASON_CODE" || "$REASON_CODE" =~ ^[A-Z][A-Z0-9_]{1,63}$ ]] || { echo "::error::reason_code must be UPPER_SNAKE_CASE"; exit 1; }
            operator="github-${ACTOR,,}"
            [[ "$operator" =~ ^github-[a-z0-9-]{1,39}$ ]]
            printf '{"command":"%s","operator":"%s","requestId":"%s","reasonCode":"%s"}\n' "$COMMAND" "$operator" "$REQUEST_ID" "$REASON_CODE" \
              | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; cat > /opt/cfmeet-core/coordinated/developer-access-review.json"
          fi

      - name: Alertmanager receiver URLs on the VPS (from environment secrets, never printed)
        # Backend gap audit P1: the receivers of the production Alertmanager are driven only
        # by the production environment secrets CFMEET_ALERT_WEBHOOK_URL (generic Alertmanager
        # webhook JSON) and CFMEET_ALERT_SLACK_WEBHOOK_URL (Slack-compatible incoming webhook),
        # both optional. A set secret is written to a root-only file of the VPS secret store;
        # an unset one removes its file, and monitoring_stack.py then deploys Alertmanager
        # without that integration. This step never fails the operation.
        if: inputs.operation == 'release' || inputs.operation == 'deploy-monitoring'
        continue-on-error: true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          CFMEET_ALERT_WEBHOOK_URL: ${{ secrets.CFMEET_ALERT_WEBHOOK_URL }}
          CFMEET_ALERT_SLACK_WEBHOOK_URL: ${{ secrets.CFMEET_ALERT_SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          valid_url() {
            python3 -c 'import os, re, sys; v = os.environ[sys.argv[1]]; sys.exit(0 if re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/[\x21-\x7e]{0,2000}", v) else 1)' "$1"
          }
          for pair in CFMEET_ALERT_WEBHOOK_URL:alertmanager-webhook-url CFMEET_ALERT_SLACK_WEBHOOK_URL:alertmanager-slack-webhook-url; do
            name="${pair%%:*}"; file="/opt/cfmeet-core/secrets/${pair#*:}"
            if [[ -z "${!name}" ]]; then
              ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "rm -f '$file'"
              echo "::warning::$name is not set: Alertmanager runs without this integration (alerts are not delivered through it)"
            elif valid_url "$name"; then
              printf '%s\n' "${!name}" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; cat > '$file.tmp' && mv '$file.tmp' '$file'"
              echo "$name: installed"
            else
              ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "rm -f '$file'"
              echo "::warning::$name is not an https URL: not installed, Alertmanager runs without this integration"
            fi
          done

      - name: App reviewers (named reviewers only)
        if: inputs.operation == 'activate-oauth-apps'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REVIEWERS: ${{ vars.CFMEET_APP_REVIEWERS }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes)
          if [[ -z "$REVIEWERS" ]]; then
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "rm -f /opt/cfmeet-core/coordinated/app-reviewers"
            echo "::warning::CFMEET_APP_REVIEWERS is not set: apps can be registered (confirm=no-reviewers-yet) but nobody can review them"
          else
            [[ "$REVIEWERS" =~ ^[A-Za-z0-9=,\ -]{1,2000}$ ]] || { echo "::error::CFMEET_APP_REVIEWERS has unexpected characters"; exit 1; }
            ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p /opt/cfmeet-core/coordinated; cat > /opt/cfmeet-core/coordinated/app-reviewers" <<< "$REVIEWERS"
          fi

      - name: Run the operation on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OPERATION: ${{ inputs.operation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=40)
          [[ "$OPERATION" =~ ^[a-z][a-z-]{1,40}$ ]]
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          # a-z, comma and hyphen; `service=<name>` (digits allowed) for activate-service-key-*.
          [[ "$CONFIRM" =~ ^[a-z0-9,=-]{0,120}$ ]] || { echo "::error::confirm may contain only a-z, 0-9, comma, equals and hyphen"; exit 1; }
          run_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          remote="/opt/cfmeet-core/coordinated-releases/$GITHUB_SHA"
          cp services/calling/tests/rtc/rtc_client.py infra/calling/production/rtc_client.py
          # The monitoring stack's rules, routing and exporter configuration (monitoring_stack.py).
          rm -rf infra/calling/production/monitoring-config
          cp -R infra/monitoring infra/calling/production/monitoring-config
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p '$remote'"
          tar -C infra/calling/production -cf - . | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "tar -C '$remote' -xf -"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" \
            "cd '$remote' && python3 -u coordinated_release.py '$OPERATION' '$RELEASE_SHA' '$run_id' '$CONFIRM'" | tee coordinated-release.log

      - name: Public API and gateway certification (read-only, unauthenticated)
        id: public
        if: always() && inputs.operation == 'certify'
        continue-on-error: true
        run: python3 infra/calling/production/public_certification.py . certification-public.json

      - name: Certification verdict
        if: always() && inputs.operation == 'certify'
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          touch coordinated-release.log
          cd infra/calling/production
          status=0
          python3 certification_report.py "$GITHUB_WORKSPACE" "$RELEASE_SHA" "$GITHUB_WORKSPACE/coordinated-release.log" \
            "$GITHUB_WORKSPACE/certification-public.json" "$GITHUB_WORKSPACE/certification.md" \
            "$GITHUB_WORKSPACE/certification.json" "$RUN_URL" || status=$?
          cat "$GITHUB_WORKSPACE/certification.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinated-release-${{ inputs.operation }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coordinated-release.log
            certification-public.json
            certification.md
            certification.json
          if-no-files-found: ignore
