name: Inspect CF Meet Calling ingress proxy

on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-calling-loopback-debug.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: SSH setup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Read-only loopback container diagnosis
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          docker ps -a --filter name=cfmeet-calling-loopback --format '{{.Names}} | {{.Status}}'
          docker inspect cfmeet-calling-loopback --format 'Runtime: {{.State.Status}} | ExitCode: {{.State.ExitCode}} | Ports: {{json .HostConfig.PortBindings}}'
          echo '=== PROXY LOGS (CONFIG ONLY, NO SECRETS) ==='
          docker logs --tail 22 cfmeet-calling-loopback 2>&1 | grep -E 'error|emerg|warn|bind|listen|start|nginx' | head -20 || true
          echo '=== ACTIVE TCP PORT (LOOPBACK) ==='
          ss -lnt | grep ':18090 ' || true
          echo '=== PRIVATE NETWORK ==='
          docker network inspect cfmeet-core-private --format '{{range .Containers}}{{println .Name}}{{end}}' | sort
          REMOTE
