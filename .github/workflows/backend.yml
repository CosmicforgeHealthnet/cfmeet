name: Backend

# services/core-api — the Rust/Axum core API (one deployable modular monolith).

on:
  push:
    branches: [main]
    paths:
      - "services/core-api/**"
      - ".github/workflows/backend.yml"
      # Once core-api generates or consumes packages/contracts, add:
      # - "packages/contracts/**"
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/backend.yml"
      # Once core-api generates or consumes packages/contracts, add:
      # - "packages/contracts/**"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/core-api

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/core-api -> target

      # Pre-existing formatting drift was imported from rtc_backend unchanged.
      # Reported but non-blocking until a dedicated `cargo fmt` commit lands.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace

  docker:
    name: Docker image (services/core-api/ context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t cfmeet-backend:ci .
