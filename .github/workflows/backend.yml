name: Meeting service

# services/meeting-service — the Rust/Axum Meeting & Conference Platform service.
# This remains one deployable modular monolith during Phase 2.

on:
  push:
    # `staging` carries Phase 2 backend work before release; it gets the same fast gate.
    branches: [main, staging]
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: meeting-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/meeting-service

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    # Database-backed integration, security, concurrency and migration tests run
    # against real PostgreSQL/Redis. Locally these are a normal PostgreSQL/Redis
    # install (no Docker Compose required); see services/meeting-service/README.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target

      # Pre-existing formatting drift (imported from rtc_backend unchanged) is listed in
      # scripts/certification/fmt-baseline.txt. Any NEW drift fails the build.
      - name: rustfmt (no new drift beyond the documented baseline)
        run: bash scripts/certification/check-fmt.sh

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      # Includes the security, IDOR, credential-replay, concurrency, failure-injection,
      # system E2E, flag/rollback and migration-certification suites.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      # Every v2 operation must have a success-path and an authorization/error-path test
      # (recorded at runtime by tests/common/route_coverage.rs).
      - name: v2 operation coverage (success + error path per operation)
        run: python3 scripts/certification/route_coverage.py --openapi ../../packages/contracts/openapi/meeting-service.json --strict

      - name: Migration smoke (up / reset / up)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE cfmeet_migration_smoke"
          export DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/cfmeet_migration_smoke
          cargo run -q -p migration -- up
          cargo run -q -p migration -- reset
          cargo run -q -p migration -- up

      - name: cargo build
        run: cargo build --workspace

      - name: OpenAPI contract export is current
        run: |
          cargo run -q --bin export_openapi > /tmp/meeting-service.json
          diff -u ../../packages/contracts/openapi/meeting-service.json /tmp/meeting-service.json

  docker:
    name: Docker image (services/meeting-service/ context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t cfmeet-meeting-service:ci .
