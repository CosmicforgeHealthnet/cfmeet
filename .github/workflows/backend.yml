name: Meeting service

# services/meeting-service — the Rust/Axum Meeting & Conference Platform service.
# This remains one deployable modular monolith during Phase 2.

on:
  push:
    branches: [main]
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: meeting-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/meeting-service

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / build
    runs-on: ubuntu-latest
    # Database-backed integration, security, concurrency and migration tests run
    # against real PostgreSQL/Redis. Locally these are a normal PostgreSQL/Redis
    # install (no Docker Compose required); see services/meeting-service/README.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target

      # Pre-existing formatting drift was imported from rtc_backend unchanged.
      # Reported but non-blocking until a dedicated `cargo fmt` commit lands.
      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build
        run: cargo build --workspace

      - name: OpenAPI contract export is current
        run: |
          cargo run -q --bin export_openapi > /tmp/meeting-service.json
          diff -u ../../packages/contracts/openapi/meeting-service.json /tmp/meeting-service.json

  docker:
    name: Docker image (services/meeting-service/ context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t cfmeet-meeting-service:ci .
