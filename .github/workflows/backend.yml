name: Meeting service

# services/meeting-service — the Rust/Axum Meeting & Conference Platform service.
# This remains one deployable modular monolith during Phase 2.
#
# Disk safety (GitHub-hosted runners have ~14 GB free): the gates are split across
# jobs so each gets a fresh runner disk, and CI builds carry no debug info
# (`CARGO_PROFILE_DEV_DEBUG=0` / `CARGO_PROFILE_TEST_DEBUG=0`) and no incremental
# state. `debug-assertions` and overflow checks stay on (separate profile settings), so
# test behaviour is unchanged; only debug symbols are dropped. The ~50 test binaries
# each link the whole service: with full debug info (plus split `.dwp` packages) they
# exhausted the runner disk ("No space left on device", os error 28).

on:
  push:
    # `staging` carries Phase 2 backend work before release; it gets the same fast gate.
    branches: [main, staging]
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - "packages/contracts/bundled/**"
      - "packages/service-auth/**"
      - "packages/migration-guard/**"
      - "packages/usage-facts/**"
      - "packages/object-storage/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-backend.yml"
      - "infra/deployment/postgres/**"
  pull_request:
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - "packages/contracts/bundled/**"
      - "packages/service-auth/**"
      - "packages/migration-guard/**"
      - "packages/usage-facts/**"
      - "packages/object-storage/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-backend.yml"
      - "infra/deployment/postgres/**"
  workflow_dispatch:

concurrency:
  group: meeting-service-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/meeting-service

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: fmt / check / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target
          key: lint

      - name: Disk usage (after cache restore)
        run: df -h / && (du -sh target 2>/dev/null || true)

      # Pre-existing formatting drift (imported from rtc_backend unchanged) is listed in
      # scripts/certification/fmt-baseline.txt. Any NEW drift fails the build.
      - name: rustfmt (no new drift beyond the documented baseline)
        run: bash scripts/certification/check-fmt.sh

      - name: cargo check
        run: cargo check --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: Disk usage (end of job)
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

  test:
    name: test / v2 operation coverage
    runs-on: ubuntu-latest
    # Database-backed integration, security, concurrency and migration tests run
    # against real PostgreSQL/Redis. Locally these are a normal PostgreSQL/Redis
    # install (no Docker Compose required); see services/meeting-service/README.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - name: Free unused runner toolchains (Android, .NET, GHC, CodeQL)
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target
          key: test

      - name: Disk usage (before cargo test)
        run: df -h / && (du -sh target 2>/dev/null || true)

      # Includes the security, IDOR, credential-replay, concurrency, failure-injection,
      # system E2E, flag/rollback and migration-certification suites.
      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: Disk usage (after cargo test)
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

      # Every v2 operation must have a success-path and an authorization/error-path test
      # (recorded at runtime by tests/common/route_coverage.rs during `cargo test`).
      - name: v2 operation coverage (success + error path per operation)
        run: python3 scripts/certification/route_coverage.py --openapi ../../packages/contracts/openapi/meeting-service.json --strict

  build:
    name: build / migration smoke / OpenAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target
          key: build

      - name: cargo build
        run: cargo build --workspace

      - name: Migration smoke (up / reset / up)
        env:
          PGPASSWORD: postgres
          # SEC-015: reset is a guarded destructive subcommand; CI is non-production.
          APP_ENV: test
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE cfmeet_migration_smoke"
          export DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/cfmeet_migration_smoke
          cargo run -q -p migration -- up
          cargo run -q -p migration -- reset
          cargo run -q -p migration -- up

      # SEC-018 meeting-service least-privilege database roles, on throwaway databases and
      # roles created by infra/deployment/postgres (see
      # docs/operations/meeting-service-database-roles.md). The histories are listed once,
      # in release order: append a new history binary to this list (an entry prefixed with
      # '?' is optional and skipped when not built).
      - name: Meeting-service migration histories (release order)
        run: |
          d="$GITHUB_WORKSPACE/services/meeting-service/target/debug"
          echo "MEETING_SERVICE_MIGRATION_BINS=$d/migration $d/account-security-migration $d/meetings-calendar-migration $d/profile-notifications-migration $d/account-communications-migration $d/account-hardening-migration $d/organization-integration-migration $d/lifecycle-delivery-migration" >> "$GITHUB_ENV"

      # New database: every history applies as the MIGRATOR role; the RUNTIME role gets
      # data access only (DML, sequences, triggers fire) and is refused DDL.
      - name: Meeting-service database roles (migrator applies all histories, runtime DML only)
        working-directory: .
        env:
          APP_ENV: test
        run: |
          infra/deployment/postgres/verify-meeting-service-roles.sh \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres

      # Today's production shape -> the cutover SQL the owner will run (dry run, refusals,
      # real run) -> the same certification -> rollback. Branch A: the runtime role owns
      # everything; branch B: the service connected as the superuser, which owns everything.
      - name: Meeting-service database role cutover and rollback rehearsal
        working-directory: .
        env:
          APP_ENV: test
        run: |
          infra/deployment/postgres/verify-meeting-service-roles.sh --rehearse-cutover \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres
          infra/deployment/postgres/verify-meeting-service-roles.sh --rehearse-cutover-from-superuser \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres

      # The same histories through the cross-service certification: meeting-service's
      # roles cannot open any other service's database and vice versa.
      - name: Service database isolation with the real meeting-service migrations
        working-directory: .
        env:
          APP_ENV: test
        run: |
          infra/deployment/postgres/verify-service-isolation.sh \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: OpenAPI contract export is current
        run: |
          cargo run -q --bin export_openapi > /tmp/meeting-service.json
          diff -u ../../packages/contracts/openapi/meeting-service.json /tmp/meeting-service.json

      - name: Disk usage (end of job)
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

  docker:
    name: Docker image (repository-root context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        working-directory: .
        run: docker build -f services/meeting-service/Dockerfile -t cfmeet-meeting-service:ci .
      - name: Disk usage
        if: always()
        run: df -h / && (docker system df || true)
