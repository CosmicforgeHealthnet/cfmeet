name: Deploy Backend

# Meeting Service: validate pull requests; production deployment is MANUAL ONLY.
# Promoting validated staging code to main must not modify the live VPS.
# A separately authorized workflow_dispatch deploys production. No staging target is configured here.
# Never deploy PR commits or overwrite the live service before smoke checks and rollback setup.
# Requires GitHub Secrets:
#   - VPS_HOST: VPS IP or hostname (e.g., 173.249.30.55)
#   - VPS_USER: SSH user (e.g., root)
#   - VPS_SSH_KEY: Private SSH key for authentication
#   - VPS_DEPLOY_PATH: Deployment path (e.g., /opt/cfmeet-production)

on:
  # One-time Part V Swagger documentation deployment; normal future merges stay manual.
  # Re-run once after fixing Swagger API selector and default-document initialization.
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-backend.yml"
  # One-time public docs cutover only after the private Swagger VPS bootstrap
  # successfully verified loopback + HTTP Basic authentication.
  workflow_run:
    workflows: ["Provision Private Swagger on VPS"]
    branches: [main]
    types: [completed]
  pull_request:
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false  # Don't cancel in-progress deployments

env:
  DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/cfmeet-production' }}

jobs:
  # Run tests before deployment
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: services/meeting-service
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target
          key: deploy-test

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(ops): one-time Part V Swagger VPS deployment') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.display_title == 'chore(docs): bootstrap private CF Meet Swagger on VPS' && github.event.workflow_run.conclusion == 'success') }}
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy verified main commit to VPS (rollback on failure)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Shell-quote remote arguments so a deployment path is never interpreted as code.
          printf -v remote_cmd 'bash -s -- %q %q %q' "$COMMIT_SHA" "$DEPLOY_PATH" "$RUN_ID"
          # The Contabo Rust release build can exceed 30 minutes; keep SSH alive
          # through otherwise quiet compile/link phases rather than losing the
          # session before container switch and smoke certification.
          ssh -o BatchMode=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=90 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" "$remote_cmd" <<'DEPLOY_SCRIPT'
            set -Eeuo pipefail
            COMMIT="$1"
            DEPLOY_PATH="$2"
            RUN_ID="$3"
            CONTAINER=cfmeet-production-backend
            PREVIOUS=cfmeet-production-backend-rollback-"$RUN_ID"
            IMAGE=cfmeet-meeting-service:prod-"$COMMIT"
            HAD_PREVIOUS=0
            SWITCH_STARTED=0

            # A queued deployment must never roll back a newer main commit.
            cd "$DEPLOY_PATH/source"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$COMMIT" || {
              echo "Deployment superseded by a newer main commit; refusing stale rollout."
              exit 1
            }
            git reset --hard "$COMMIT"

            # Emit output while Rust compiles without logging; many SSH/network
            # intermediaries drop an otherwise silent connection near 30 minutes.
            # The heartbeat runs only during this build and is always reaped.
            ( while sleep 25; do
                printf '[deploy] Docker build still running at %s\n' "$(date -u +%FT%TZ)"
              done ) &
            BUILD_HEARTBEAT_PID=$!
            BUILD_RESULT=0
            docker build -f services/meeting-service/Dockerfile \
              -t "$IMAGE" -t cfmeet-meeting-service:prod-latest . || BUILD_RESULT=$?
            kill "$BUILD_HEARTBEAT_PID" 2>/dev/null || true
            wait "$BUILD_HEARTBEAT_PID" 2>/dev/null || true
            if [ "$BUILD_RESULT" -ne 0 ]; then
              echo "Docker build failed (exit $BUILD_RESULT); existing production container untouched."
              exit "$BUILD_RESULT"
            fi

            # Migrations are required to be backward-compatible. This step is
            # intentionally before cutover and is not rolled back automatically.
            docker run --rm \
              --network rtc_backend_cosmicforge-network \
              --env-file "$DEPLOY_PATH/.env" \
              "$IMAGE" ./migration up

            rollback() {
              rc=$?
              trap - EXIT
              if [ "$rc" -ne 0 ] && [ "$SWITCH_STARTED" -eq 1 ]; then
                echo "Deployment failed; restoring prior backend container."
                docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
                if [ "$HAD_PREVIOUS" -eq 1 ]; then
                  docker rename "$PREVIOUS" "$CONTAINER" || true
                  docker start "$CONTAINER" || true
                  curl -fsS --max-time 5 http://127.0.0.1:18081/health || true
                fi
              fi
              exit "$rc"
            }
            trap rollback EXIT

            SWITCH_STARTED=1
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              HAD_PREVIOUS=1
              docker rename "$CONTAINER" "$PREVIOUS"
              docker stop "$PREVIOUS"
            fi

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --env-file "$DEPLOY_PATH/.env" \
              --network rtc_backend_cosmicforge-network \
              -p 127.0.0.1:18081:8080 \
              "$IMAGE"

            # Certify the actual container, not merely a successful docker run.
            READY=0
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:18081/health >/dev/null \
                 && curl -fsS --max-time 5 http://127.0.0.1:18081/api-docs/numbering.json >/dev/null \
                 && curl -fsS --max-time 5 http://127.0.0.1:18081/api-docs/sms-gateway.json >/dev/null \
                 && curl -fsSL --max-time 5 http://127.0.0.1:18081/swagger-ui/ >/dev/null; then
                READY=1
                break
              fi
              sleep 2
            done
            if [ "$READY" -ne 1 ]; then
              docker logs "$CONTAINER" --tail 80 || true
              echo "Health / Swagger smoke check failed."
              exit 1
            fi

            SWITCH_STARTED=0
            trap - EXIT
            if [ "$HAD_PREVIOUS" -eq 1 ]; then
              docker rm "$PREVIOUS" || echo "Warning: previous stopped container retained."
            fi
            echo "Verified Meeting Service deployment at $COMMIT"
          DEPLOY_SCRIPT

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
