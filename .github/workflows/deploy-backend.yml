name: Deploy Backend

# Meeting Service tests on every relevant push / PR. Production releases of ALL backend
# services, the Meeting Service included, go through cfmeet-coordinated-release.yml (one SHA,
# green CI, backups, dependency order, rollback). A main push therefore no longer deploys:
# two release paths for the same container could race or roll each other back.
# The manual dispatch below remains as an emergency Meeting-only path; it shares the
# deploy-backend-production concurrency group with the coordinated release, and the next
# coordinated release brings the Meeting Service back to its verified release image.
# Never deploy PR commits or overwrite the live service before smoke checks and rollback setup.
# Requires GitHub Secrets:
#   - VPS_HOST: VPS IP or hostname (e.g., 173.249.30.55)
#   - VPS_USER: SSH user (e.g., root)
#   - VPS_SSH_KEY: Private SSH key for authentication
#   - VPS_DEPLOY_PATH: Deployment path (e.g., /opt/cfmeet-production)

on:
  push:
    branches: [main]
    # Only deploy changes that alter this Meeting Service image and its dependencies.
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/openapi/**"
      - "packages/contracts/bundled/**"
      - "packages/service-auth/**"
      - "packages/usage-facts/**"
      - "packages/object-storage/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "services/meeting-service/**"
      - "packages/contracts/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

permissions:
  contents: read


env:
  DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/opt/cfmeet-production' }}

jobs:
  # Run tests before deployment
  test:
    name: Pre-deploy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    defaults:
      run:
        working-directory: services/meeting-service
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/meeting-service -> target
          key: deploy-test

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  deploy:
    # Manual dispatch only (emergency path); pushes are released by the coordinated release.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.test.result == 'success' }}
    name: Deploy to VPS (manual)
    needs: [test]
    # The production lock shared with cfmeet-coordinated-release.yml and the mutating
    # cfmeet-calling-production.yml operations; tests do not hold it.
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Deploy verified main commit to VPS (rollback on failure)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Shell-quote remote arguments so a deployment path is never interpreted as code.
          printf -v remote_cmd 'bash -s -- %q %q %q' "$COMMIT_SHA" "$DEPLOY_PATH" "$RUN_ID"
          # The Contabo Rust release build can exceed 30 minutes; keep SSH alive
          # through otherwise quiet compile/link phases rather than losing the
          # session before container switch and smoke certification.
          ssh -o BatchMode=yes \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=90 \
            -o TCPKeepAlive=yes \
            "$VPS_USER@$VPS_HOST" "$remote_cmd" <<'DEPLOY_SCRIPT'
            set -Eeuo pipefail
            COMMIT="$1"
            DEPLOY_PATH="$2"
            RUN_ID="$3"
            CONTAINER=cfmeet-production-backend
            PREVIOUS=cfmeet-production-backend-rollback-"$RUN_ID"
            IMAGE=cfmeet-meeting-service:prod-"$COMMIT"
            HAD_PREVIOUS=0
            SWITCH_STARTED=0

            # A queued deployment must never roll back a newer main commit.
            cd "$DEPLOY_PATH/source"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$COMMIT" || {
              echo "Deployment superseded by a newer main commit; refusing stale rollout."
              exit 1
            }
            git reset --hard "$COMMIT"

            # Emit output while Rust compiles without logging; many SSH/network
            # intermediaries drop an otherwise silent connection near 30 minutes.
            # The heartbeat runs only during this build and is always reaped.
            ( while sleep 25; do
                printf '[deploy] Docker build still running at %s\n' "$(date -u +%FT%TZ)"
              done ) &
            BUILD_HEARTBEAT_PID=$!
            BUILD_RESULT=0
            docker build -f services/meeting-service/Dockerfile \
              -t "$IMAGE" -t cfmeet-meeting-service:prod-latest . || BUILD_RESULT=$?
            kill "$BUILD_HEARTBEAT_PID" 2>/dev/null || true
            wait "$BUILD_HEARTBEAT_PID" 2>/dev/null || true
            if [ "$BUILD_RESULT" -ne 0 ]; then
              echo "Docker build failed (exit $BUILD_RESULT); existing production container untouched."
              exit "$BUILD_RESULT"
            fi

            # Preserve the exact running secrets, mounts, private networks and
            # loopback ingress; validate a private candidate and retain rollback.
            python3 infra/deployment/backend_runtime.py --image "$IMAGE" --run-id "$RUN_ID"
          DEPLOY_SCRIPT

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
