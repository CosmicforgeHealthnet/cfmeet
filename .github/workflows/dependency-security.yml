name: Dependency and image security

# Part K section 109 / Part J section 97: supply-chain gates for the Part III services
# (and the Part V Messaging cryptographic core).
#
#  * RustSec advisories for every Calling / Privacy Relay / Telephony / shared-package
#    lockfile (cargo-audit). A vulnerability fails the job; an advisory is ignored only
#    with a written, reviewed justification below.
#  * Each service image: built from the repository-root context exactly as in its
#    service workflow, its exported root filesystem scanned by the repository secret
#    scanner (key material, keyrings, credentials), and its Debian base checked for
#    pending security updates (the runtime stage applies them at build time).
#
# The Meeting Service lockfile is owned by its own workflow and is not gated here.

on:
  push:
    branches: [main, staging]
    paths:
      - "services/calling/**"
      - "services/privacy-relay/**"
      - "services/telephony/**"
      - "services/messaging/**"
      - "services/platform-access/**"
      - "services/sms-gateway/**"
      - "services/numbering/**"
      - "services/meeting-service/**"
      - "scripts/sbom/**"
      - "packages/**"
      - "scripts/secret-scan/**"
      - "scripts/security/**"
      - ".github/workflows/dependency-security.yml"
  pull_request:
    paths:
      - "services/calling/**"
      - "services/privacy-relay/**"
      - "services/telephony/**"
      - "services/messaging/**"
      - "services/platform-access/**"
      - "services/sms-gateway/**"
      - "services/numbering/**"
      - "services/meeting-service/**"
      - "scripts/sbom/**"
      - "packages/**"
      - "scripts/secret-scan/**"
      - "scripts/security/**"
      - ".github/workflows/dependency-security.yml"
  schedule:
    # Weekly, so new advisories against unchanged lockfiles are noticed.
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-advisories:
    name: RustSec advisories (${{ matrix.lockfile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - services/calling
          - services/privacy-relay
          - services/telephony
          - packages/service-auth
          - packages/webhooks
          - packages/object-storage
          - packages/contracts/validator
          - packages/messaging-crypto
          - services/messaging
          # Part V K §158: every service lockfile is audited (these four were not).
          - services/platform-access
          - services/sms-gateway
          - services/numbering
          - services/meeting-service
          # Part K final gap closure: the browser crypto core and its Chromium harness.
          - packages/messaging-crypto/wasm
          - packages/messaging-crypto/web-harness
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (rsa, Marvin timing attack; no fixed release exists): `rsa` is
      # linked only through jsonwebtoken's rust_crypto backend. No Part III code loads,
      # accepts or uses an RSA key: service tokens are EdDSA-only (RS256 is rejected by
      # packages/service-auth, tested), signaling / media credentials are HS256. The one
      # RSA key in the platform — Messaging's FCM service-account key — is parsed and used
      # for RS256 signing by `ring` (constant time), never by the `rsa` crate
      # (services/messaging/tests/architecture.rs rsa_keys_are_never_handled_by_the_rsa_crate).
      #
      # RUSTSEC-2026-0330 / RUSTSEC-2026-0331 (libcrux-kem 0.0.9; packages/messaging-crypto
      # only): hpke-rs 0.7.0 pins its optional libcrux backend (hpke-rs-libcrux =0.7.0 ->
      # libcrux-kem 0.0.9), so the crate is in the lockfile, but the backend is never
      # enabled: OpenMLS uses the RustCrypto HPKE backend. The step below proves
      # libcrux-kem is in no build graph (any target, all features); the ignore is lifted
      # when hpke-rs releases a fixed pin (ADR 0045).
      - name: libcrux-kem is never compiled into the Messaging crypto core
        if: startsWith(matrix.lockfile, 'packages/messaging-crypto') || matrix.lockfile == 'services/messaging' || matrix.lockfile == 'services/meeting-service'
        working-directory: ${{ matrix.lockfile }}
        run: |
          set -euo pipefail
          out="$(cargo tree --locked -e all --all-features --target all -i libcrux-kem 2>&1 || true)"
          echo "$out" | grep -q "nothing to print" \
            || { echo "$out"; echo "::error::libcrux-kem is linked; the advisory ignore no longer holds"; exit 1; }
      # RUSTSEC-2026-0381 (webpki-roots < 1.0.10 trusts distrusted emSign intermediates):
      # fixed by webpki-roots 1.0.10, which every lockfile now carries. sqlx 0.8 (via
      # sea-orm 1.1; no 0.8 release drops it) still depends on webpki-roots 0.26, whose
      # last release 0.26.11 is a shim with no certificate data that re-exports
      # TLS_SERVER_ROOTS from webpki-roots 1 — so the compiled root store is the fixed
      # one, while cargo-audit matches the shim's version number. The step below proves,
      # from Cargo.lock, that every 0.26 copy is exactly that shim (pinned checksum) over a
      # webpki-roots >= 1.0.10, and that no vulnerable 1.x remains; otherwise the job
      # fails. The ignore is lifted with the sea-orm 2 / sqlx 0.9 upgrade.
      - name: webpki-roots 0.26 is only the re-export shim over a fixed webpki-roots 1
        run: |
          set -euo pipefail
          (cd scripts/security && python3 -m unittest -q test_check_webpki_roots_shim)
          python3 scripts/security/check_webpki_roots_shim.py "${{ matrix.lockfile }}/Cargo.lock"
      - name: cargo audit
        working-directory: ${{ matrix.lockfile }}
        run: >-
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0381
          ${{ (startsWith(matrix.lockfile, 'packages/messaging-crypto') || matrix.lockfile == 'services/messaging' || matrix.lockfile == 'services/meeting-service') && '--ignore RUSTSEC-2026-0330 --ignore RUSTSEC-2026-0331' || '' }}

  sbom:
    # Part V K §158: a CycloneDX software bill of materials of every tracked Cargo.lock
    # (exact versions, sources, registry checksums), kept as a build artifact.
    name: SBOM (CycloneDX, every Rust lockfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: generate
        run: |
          set -euo pipefail
          python3 scripts/sbom/cargo_lock_sbom.py cfmeet-backend.cdx.json $(git ls-files '*Cargo.lock')
      - uses: actions/upload-artifact@v4
        with:
          name: cfmeet-backend-sbom
          path: cfmeet-backend.cdx.json

  image:
    name: image security (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [calling, privacy-relay, telephony]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: docker build
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t cfmeet-${{ matrix.service }}:security .
      - name: secret scan of the exported image filesystem
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rootfs"
          mkdir -p "$root"
          container="$(docker create cfmeet-${{ matrix.service }}:security)"
          docker export "$container" | tar -x -C "$root"
          docker rm "$container" >/dev/null
          python3 scripts/secret-scan/scan_secrets.py --tree "$root"
      - name: no pending Debian security updates in the runtime image
        run: |
          set -euo pipefail
          pending="$(docker run --rm --user 0 --entrypoint /bin/sh cfmeet-${{ matrix.service }}:security -c \
            'apt-get update -qq >/dev/null && apt-get -s upgrade | grep "^Inst" | grep -i "security" || true')"
          if [ -n "$pending" ]; then
            echo "$pending"
            echo "::error::the ${{ matrix.service }} runtime image has pending Debian security updates"
            exit 1
          fi
          echo "no pending Debian security updates"
