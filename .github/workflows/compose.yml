name: Compose config

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infra/**"
      - "services/meeting-service/Dockerfile"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "infra/**"
      - "services/meeting-service/Dockerfile"
      - ".github/workflows/compose.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root docker-compose.yml
        run: |
          cp services/meeting-service/.env.example services/meeting-service/.env
          docker compose config --quiet
          docker compose --profile app config --quiet
