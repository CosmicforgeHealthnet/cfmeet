name: Compose config

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "services/meeting-service/Dockerfile"
      - ".github/workflows/compose.yml"
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.prod.yml"
      - "infra/**"
      - "services/meeting-service/Dockerfile"
      - ".github/workflows/compose.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate root docker-compose.yml (development)
        run: |
          cp services/meeting-service/.env.example services/meeting-service/.env
          docker compose config --quiet
          docker compose --profile app config --quiet

      - name: Validate docker-compose.prod.yml (production)
        run: |
          # Create minimal .env for validation
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=test
          DATABASE_URL=postgres://user:pass@postgres:5432/cfmeet
          JWT_SECRET=test-secret-key
          LIVEKIT_URL=wss://livekit.example.com
          LIVEKIT_API_KEY=test-key
          LIVEKIT_API_SECRET=test-secret
          APP_URL=https://example.com
          FRONTEND_URLS=https://example.com
          EOF
          docker compose -f docker-compose.prod.yml config --quiet
