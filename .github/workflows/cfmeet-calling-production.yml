name: CF Meet Calling production infrastructure and acceptance

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [communications-inspect, communications-stage, communications-release, communications-verify, communications-rollback, inspect, compatibility, release-backend, test-enterprise, test-recording, test-voicemail, encrypt-storage, complete-safe-infrastructure, provision, harden-egress, storage-ingress, configure-capture, verify, activate, rollback]
        default: inspect
        required: true
      image_sha:
        description: 'Existing immutable image source SHA; service code must match this workflow revision'
        type: string
        required: false

permissions: { contents: read, packages: read }
concurrency:
  group: ${{ startsWith(inputs.operation, 'communications-') && inputs.operation != 'communications-inspect' && 'deploy-backend-production' || inputs.operation == 'inspect' && 'cfmeet-calling-inspect' || 'cfmeet-calling-production' }}
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check activation gates and runtime preservation
        run: python3 -m unittest discover -s infra/calling/production -p 'test_*.py' -v
      - name: Configure existing production SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Authenticate for existing core images
        if: inputs.operation == 'communications-stage' || inputs.operation == 'communications-release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Transfer exact Communications release images through SSH
        if: inputs.operation == 'communications-stage' || inputs.operation == 'communications-release'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_SHA: ${{ inputs.image_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git diff --exit-code "$IMAGE_SHA" "$GITHUB_SHA" -- services packages/service-auth packages/communications-policy packages/contracts/bundled packages/contracts/openapi
          available=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "df -k --output=avail / | tail -n1")
          [[ "$available" =~ ^[[:space:]]*[0-9]+$ ]] && (( available > 5242880 ))
          for service in platform-access meeting-service calling messaging communications; do
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cfmeet-$service:$IMAGE_SHA"
            docker pull "$image"
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")
            [[ "$revision" == "$IMAGE_SHA" ]]
            docker save "$image" | gzip -1 | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 "$VPS_USER@$VPS_HOST" 'gzip -dc | docker load'
          done
      - name: Execute versioned production operation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          OPERATION: ${{ inputs.operation }}
          IMAGE_SHA: ${{ inputs.image_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == communications-inspect || "$OPERATION" == communications-stage ]]; then
            [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/heads/staging ]]
          else
            [[ "$GITHUB_REF" == refs/heads/main ]]
          fi
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          remote="/opt/cfmeet-core/production-releases/$GITHUB_SHA"
          cp services/calling/tests/rtc/rtc_client.py infra/calling/production/rtc_client.py
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 "$VPS_USER@$VPS_HOST" "umask 077; mkdir -p '$remote'"
          tar -C infra/calling/production -cf - . | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 "$VPS_USER@$VPS_HOST" "tar -C '$remote' -xf -"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=12 "$VPS_USER@$VPS_HOST" "python3 -u '$remote/production.py' '$OPERATION' '$IMAGE_SHA' '$GITHUB_RUN_ID'" | tee production-result.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calling-production-${{ github.run_id }}
          path: production-result.log
          if-no-files-found: ignore
