name: Communications Hub foundation
on:
  push:
    branches: [main, staging]
    paths:
      - "services/communications/**"
      - "services/calling/**"
      - "services/messaging/**"
      - "services/meeting-service/**"
      - "packages/communications-policy/**"
      - "packages/service-auth/**"
      - ".github/workflows/communications-hub.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communications-hub-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/communications -> target
            packages/communications-policy -> target
            packages/service-auth -> target
      - name: Hub format, lint, migrations and PostgreSQL acceptance
        run: |
          cargo fmt --manifest-path services/communications/Cargo.toml --all -- --check
          cargo clippy --manifest-path services/communications/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path services/communications/Cargo.toml --all-targets --locked
          cargo test --manifest-path packages/communications-policy/Cargo.toml --locked
          cargo test --manifest-path packages/service-auth/Cargo.toml --locked
  consumers:
    strategy:
      fail-fast: false
      matrix:
        service: [calling, messaging, meeting-service]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }} -> target
      - name: Compile authoritative consumer hooks and additive migrators
        run: cargo check --manifest-path services/${{ matrix.service }}/Cargo.toml --all-targets --locked
