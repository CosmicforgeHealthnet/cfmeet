name: Build CF Meet core service images

# Build-only workflow. Never deploys, migrates, starts containers, changes VPS
# configuration, or publishes production ingress. Production use is exclusively through
# cfmeet-coordinated-release.yml, which calls this workflow for the release SHA, verifies
# every image's revision label and transfers the exact images to the VPS.
# An image that already exists for this SHA with the matching revision label is reused.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cfmeet-core-images.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: cfmeet-core-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build ${{ matrix.service }} image
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [platform-access, organizations, messaging, calling, communications, numbering, privacy-relay, sms-gateway, telephony, meeting-service, developer-platform, api-gateway, security-scan-gateway]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "ref=ghcr.io/${owner}/cfmeet-${{ matrix.service }}:${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx with attestation support
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse an existing image of this exact revision
        id: existing
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if docker pull -q "$IMAGE_REF" >/dev/null 2>&1; then
            revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE_REF")
            if [[ "$revision" == "$GITHUB_SHA" ]]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "Reused ${IMAGE_REF} (revision verified)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Existing tag has revision '$revision'; rebuilding"
          fi
          echo "reuse=false" >> "$GITHUB_OUTPUT"

      - name: Build and publish from service-specific Dockerfile
        id: build
        if: steps.existing.outputs.reuse != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=core-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=core-${{ matrix.service }}

      - name: Record immutable published reference
        if: steps.existing.outputs.reuse != 'true'
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          echo "Digest ${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published ${IMAGE_REF}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Deployment happens only through cfmeet-coordinated-release.yml (gated, verified, with rollback)." >> "${GITHUB_STEP_SUMMARY}"
