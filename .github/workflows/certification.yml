name: Part VI cross-service certification

# certification/ — the stand-alone, non-deployable certification harness (Part VI
# Chapters 6–9). The journeys start the REAL service binaries as processes (Platform
# Access, Developer Platform + worker, API Gateway, Meeting Service, Calling, Messaging,
# Numbering, SMS Gateway, Privacy Relay) with real Ed25519 service authentication (trust
# bundles derived from the packages/service-auth permission registry), one PostgreSQL
# database per service migrated by its own migration binary, real Redis and deterministic
# adapters only (no carrier, PSTN, SMS provider, media provider or paid access).
#
# The sdk-parity job runs the TypeScript and Dart SDKs' real-stack suites (every scenario
# of sdks/testdata/parity-scenarios.json, Part VI §52 / §20.2) against one stack started
# by `cfmeet-cert-stack up`.
#
# Staging-only validation: nothing here deploys anything.

on:
  push:
    branches: [main, staging]
    paths:
      - "certification/**"
      - "services/**"
      - "packages/service-auth/**"
      - "packages/usage-facts/**"
      - "packages/messaging-crypto/**"
      - "packages/contracts/**"
      - "packages/object-storage/**"
      - "packages/webhooks/**"
      - "infra/api-gateway/**"
      - "sdks/**"
      - "apps/web/public/messaging-crypto/**"
      - ".github/workflows/certification.yml"
  pull_request:
    paths:
      - "certification/**"
      - "services/**"
      - "packages/service-auth/**"
      - "packages/usage-facts/**"
      - "packages/messaging-crypto/**"
      - "packages/contracts/**"
      - "packages/object-storage/**"
      - "packages/webhooks/**"
      - "infra/api-gateway/**"
      - "sdks/**"
      - "apps/web/public/messaging-crypto/**"
      - ".github/workflows/certification.yml"
  workflow_dispatch:

concurrency:
  group: certification-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: certification

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: fmt / clippy / unit tests / boundaries
    runs-on: ubuntu-latest
    env:
      # The journeys run in their own job below (with every service binary).
      CFMEET_SKIP_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: certification -> target
          key: lint
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests (registry-derived trust bundles load; journeys skipped explicitly)
        run: cargo test --locked
      - name: The harness depends on no service crate
        working-directory: .
        run: |
          set -euo pipefail
          if grep -n -E 'path *= *"\.\./services/' certification/Cargo.toml; then
            echo "::error::certification/ must exercise services as binaries, never as crates"; exit 1
          fi
          python3 scripts/service-boundaries/check_service_boundaries.py

  journeys:
    name: journeys (real processes, real service auth, Postgres, Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CFMEET_BIN_DIR: ${{ github.workspace }}/.cfmeet-bin
    steps:
      - name: Free runner disk (nine service workspaces are built)
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/platform-access -> target
            services/developer-platform -> target
            services/api-gateway -> target
            services/meeting-service -> target
            services/calling -> target
            services/messaging -> target
            services/numbering -> target
            services/sms-gateway -> target
            services/privacy-relay -> target
            certification -> target
          key: journeys
      - name: Build every service binary (each service is its own cargo workspace)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$CFMEET_BIN_DIR"
          for s in platform-access developer-platform api-gateway meeting-service calling \
                   messaging numbering sms-gateway privacy-relay; do
            echo "::group::$s"
            (cd "services/$s" && cargo build --workspace --bins --locked)
            find "services/$s/target/debug" -maxdepth 1 -type f -executable \
              -exec cp {} "$CFMEET_BIN_DIR/" \;
            echo "::endgroup::"
          done
          ls -1 "$CFMEET_BIN_DIR"
      - name: Certification journeys (one stack per journey, run serially)
        run: cargo test --locked --no-fail-fast -- --test-threads=1 --nocapture

  sdk-parity:
    name: SDK parity (TypeScript + Dart against the real stack)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      CFMEET_BIN_DIR: ${{ github.workspace }}/.cfmeet-bin
      # Written by `cfmeet-cert-stack up` once the stack is provisioned.
      CFMEET_STACK_ENV: ${{ github.workspace }}/.cfmeet-stack-env.json
      # The Dart SDK's FFI bridge (built below); the TypeScript suite's cross-SDK scenario
      # runs the Dart interop peer, which loads it too.
      CFMEET_MESSAGING_CRYPTO_LIB: ${{ github.workspace }}/packages/messaging-crypto/ffi/target/debug/libcf_messaging_crypto_ffi.so
    steps:
      - name: Free runner disk (nine service workspaces are built)
        working-directory: .
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/platform-access -> target
            services/developer-platform -> target
            services/api-gateway -> target
            services/meeting-service -> target
            services/calling -> target
            services/messaging -> target
            services/numbering -> target
            services/sms-gateway -> target
            services/privacy-relay -> target
            certification -> target
            packages/messaging-crypto/ffi -> target
          key: sdk-parity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build every service binary (each service is its own cargo workspace)
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p "$CFMEET_BIN_DIR"
          for s in platform-access developer-platform api-gateway meeting-service calling \
                   messaging numbering sms-gateway privacy-relay; do
            echo "::group::$s"
            (cd "services/$s" && cargo build --workspace --bins --locked)
            find "services/$s/target/debug" -maxdepth 1 -type f -executable \
              -exec cp {} "$CFMEET_BIN_DIR/" \;
            echo "::endgroup::"
          done
          ls -1 "$CFMEET_BIN_DIR"
      - name: Build the stack launcher (cfmeet-cert-stack)
        run: cargo build --locked --bin cfmeet-cert-stack
      - name: Build the native messaging crypto library (Dart FFI bridge)
        working-directory: packages/messaging-crypto/ffi
        run: |
          cargo build --locked
          test -f "$CFMEET_MESSAGING_CRYPTO_LIB"
      - name: TypeScript SDK (npm ci, build the test suite and its interop peer)
        working-directory: sdks/typescript
        run: |
          npm ci
          npx tsc -p tsconfig.test.json
      - name: Dart SDK (dart pub get)
        working-directory: sdks/dart
        run: dart pub get
      - name: Start the certification stack (background) and wait for its environment file
        run: |
          set -euo pipefail
          rm -f "$CFMEET_STACK_ENV"
          nohup ./target/debug/cfmeet-cert-stack up --env-out "$CFMEET_STACK_ENV" \
            > "$RUNNER_TEMP/cfmeet-stack.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cfmeet-stack.pid"
          for _ in $(seq 1 300); do
            if [ -s "$CFMEET_STACK_ENV" ]; then
              tail -n 1 "$RUNNER_TEMP/cfmeet-stack.log"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/cfmeet-stack.pid")" 2>/dev/null; then
              echo "::error::cfmeet-cert-stack exited before writing $CFMEET_STACK_ENV"
              cat "$RUNNER_TEMP/cfmeet-stack.log"
              exit 1
            fi
            sleep 1
          done
          echo "::error::no stack environment after 300 s"
          cat "$RUNNER_TEMP/cfmeet-stack.log"
          exit 1
      - name: TypeScript SDK real-stack parity suite
        working-directory: sdks/typescript
        run: node --test --test-reporter=spec build-test/test/integration.test.js
      - name: Dart SDK real-stack parity suite
        if: ${{ !cancelled() }}
        working-directory: sdks/dart
        run: dart test test/stack_integration_test.dart --reporter expanded
      - name: Service logs (on failure, before the stack removes its work directory)
        if: ${{ failure() }}
        run: |
          python3 - <<'PY' || true
          import json, os, pathlib
          logs = pathlib.Path(json.load(open(os.environ["CFMEET_STACK_ENV"]))["stack"]["logs"])
          for f in sorted(logs.glob("*.log")):
              print(f"----- {f.name} -----")
              print("\n".join(f.read_text(errors="replace").splitlines()[-80:]))
          PY
      - name: Stop the certification stack (tears down its databases)
        if: ${{ always() }}
        run: |
          pid_file="$RUNNER_TEMP/cfmeet-stack.pid"
          if [ -f "$pid_file" ] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
            kill -TERM "$(cat "$pid_file")"
            for _ in $(seq 1 60); do
              kill -0 "$(cat "$pid_file")" 2>/dev/null || break
              sleep 1
            done
          fi
          tail -n 20 "$RUNNER_TEMP/cfmeet-stack.log" 2>/dev/null || true
