name: Messaging

# Part V Unified Messaging (ADR 0045-0048): services/messaging — the Messaging backend
# foundation (conversations, devices and their PUBLIC MLS material, key-transparency log,
# outbox; its own PostgreSQL database) — and the shared cryptographic core
# packages/messaging-crypto (MLS 1.0 / OpenMLS, RFC 9162 transparency proofs).
# Messaging depends only on packages/service-auth, packages/messaging-crypto,
# packages/object-storage (protected attachment storage) and its contracts; at runtime on Platform Access (the test job runs the REAL Platform Access
# binaries for the cross-service certification).
# Independent of every other service: this workflow never builds, starts or deploys the
# Meeting Service, Calling, Numbering, the SMS Gateway or any other service, and nothing
# here deploys anything.
#
# Scope of the claims: these jobs test the operations implemented in this repository
# (KeyPackage validation, device binding, transparency proofs). They are NOT an E2EE
# protocol certification. Mobile / Web targets are compile-checked only.
#
# CI builds carry no debug info and no incremental state; debug assertions stay on.

on:
  push:
    branches: [main, staging]
    paths:
      - "services/messaging/**"
      - "services/platform-access/**"
      - "packages/messaging-crypto/**"
      - "packages/object-storage/**"
      - "packages/service-auth/**"
      - "packages/contracts/**"
      - "infra/deployment/**"
      - "scripts/messaging/**"
      - ".github/workflows/messaging.yml"
  pull_request:
    paths:
      - "services/messaging/**"
      - "services/platform-access/**"
      - "packages/messaging-crypto/**"
      - "packages/object-storage/**"
      - "packages/service-auth/**"
      - "packages/contracts/**"
      - "infra/deployment/**"
      - "scripts/messaging/**"
      - ".github/workflows/messaging.yml"
  workflow_dispatch:

concurrency:
  group: messaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  crypto-core:
    name: crypto core (fmt / clippy / tests / targets)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/messaging-crypto
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, aarch64-apple-ios, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/messaging-crypto -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (public half, as the backend links it)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo clippy (client feature)
        run: cargo clippy --all-targets --locked --features client -- -D warnings

      # Real OpenMLS objects: generated by a client device, validated by the public
      # validator; tampering, foreign devices, lifetimes; RFC 9162 proofs against a
      # reference implementation.
      # RFC 9420 published test vectors (Part V §144 / Appendix N), downloaded at a pinned
      # commit and SHA-256-checked; the vector tests fail (not skip) when they are absent.
      - name: fetch the RFC 9420 test vectors (pinned, digest-checked)
        working-directory: .
        run: scripts/messaging/fetch-mls-test-vectors.sh "$RUNNER_TEMP/mls-test-vectors"

      - name: cargo test (all features, incl. RFC 9420 vectors)
        env:
          MLS_TEST_VECTORS_DIR: ${{ runner.temp }}/mls-test-vectors
          MLS_TEST_VECTORS_REQUIRED: "1"
        run: cargo test --locked --all-features --no-fail-fast

      - name: dependency licence review (client and public halves)
        working-directory: .
        run: |
          set -euo pipefail
          (cd scripts/messaging && python3 -m unittest -q test_check_licenses)
          python3 scripts/messaging/check_licenses.py packages/messaging-crypto --all-features

      # Asserted on Cargo's resolved graph (all targets, features per package), not on the
      # wording of an inverse query. The self-test proves real violations fail and command
      # failures are never read as "absent".
      - name: dependency-graph guard self-test (allowed and deliberately prohibited graphs)
        working-directory: .
        run: scripts/messaging/test-check-backend-crypto-graph.sh

      - name: the public half builds without the client key-generation code
        working-directory: .
        run: |
          set -euo pipefail
          scripts/messaging/check-backend-crypto-graph.sh expect-absent packages/messaging-crypto
          scripts/messaging/check-backend-crypto-graph.sh expect-present packages/messaging-crypto --features client

      # Compile-only evidence: not linked, not run on a device or in a browser.
      - name: cargo check (Android / iOS / Web, compile-only)
        run: |
          set -euo pipefail
          cargo check --locked --features client --target aarch64-linux-android
          cargo check --locked --features client --target aarch64-apple-ios
          cargo check --locked --features web --target wasm32-unknown-unknown

  lint:
    name: service fmt / check / clippy / boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/messaging
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/messaging -> target
          key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Architecture tests (no foreign source / tables, public crypto half only, no key / content logging)
        run: cargo test --locked --test architecture

      - name: the backend never links client key generation (every crate, target and feature)
        working-directory: .
        run: |
          set -euo pipefail
          scripts/messaging/check-backend-crypto-graph.sh expect-absent services/messaging --workspace
          scripts/messaging/check-backend-crypto-graph.sh expect-absent services/messaging --workspace --all-features
          scripts/messaging/check-backend-crypto-graph.sh expect-absent services/messaging --workspace --no-default-features

      - name: dependency licence review (the backend)
        working-directory: .
        run: python3 scripts/messaging/check_licenses.py services/messaging --workspace --all-features

      - name: Repository guards (no other service's source or tables)
        working-directory: .
        run: |
          set -euo pipefail
          if grep -n -E 'services/(calling|platform-access|numbering|privacy-relay|telephony|meeting-service|sms-gateway)|\.\./(calling|platform-access|numbering|privacy-relay|telephony|meeting-service|sms-gateway)' \
               services/messaging/Cargo.toml services/messaging/migration/Cargo.toml; then
            echo "::error::services/messaging depends on another service"; exit 1
          fi
          if grep -rn -i -P 'CREATE TABLE (?!messaging_)' services/messaging/migration/src; then
            echo "::error::services/messaging creates a table outside its domain"; exit 1
          fi

  test:
    name: service test (PostgreSQL, Redis, MinIO, ClamAV, real Platform Access)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Self-hosted realtime broker / ephemeral presence (never the message store).
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      MESSAGING_TEST_REDIS_URL: redis://127.0.0.1:6379/
      MESSAGING_REDIS_REQUIRED: "1"
      # Private S3-compatible attachment storage (MinIO without a KMS: no SSE-S3).
      OBJECT_STORAGE_TEST_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_TEST_ACCESS_KEY: cfmeet-ci
      OBJECT_STORAGE_TEST_SECRET_KEY: cfmeet-ci-only-not-a-secret
      OBJECT_STORAGE_TEST_SSE: ""
      OBJECT_STORAGE_TEST_REQUIRED: "1"
      MESSAGING_TEST_CLAMAV_ADDRESS: 127.0.0.1:3310
      MESSAGING_CLAMAV_REQUIRED: "1"
    defaults:
      run:
        working-directory: services/messaging
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/messaging -> target
            services/platform-access -> target
          key: test

      # Service containers cannot take a command, so MinIO starts here (the pgsty/minio build
      # pinned by digest, as in phase2-backend-certification.yml).
      - name: Start MinIO (private attachment bucket)
        working-directory: .
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cfmeet-ci -e MINIO_ROOT_PASSWORD=cfmeet-ci-only-not-a-secret \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done
          docker logs minio; exit 1

      # The real clamd engine and INSTREAM protocol, loaded with a single test signature
      # (the EICAR test file's MD5) so the run is deterministic and offline. Production
      # loads the freshclam-maintained databases; nothing here claims their coverage.
      - name: Start clamd (self-hosted scanner, EICAR test signature)
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav-daemon netcat-openbsd >/dev/null
          sudo systemctl stop clamav-daemon clamav-freshclam 2>/dev/null || true
          d="$RUNNER_TEMP/clamav"; mkdir -p "$d/db"
          echo '44d88612fea8a8f36de82e1278abb02f:68:Eicar-Test-Signature' > "$d/db/eicar.hdb"
          printf 'DatabaseDirectory %s\nTCPSocket 3310\nTCPAddr 127.0.0.1\nForeground yes\nStreamMaxLength 100M\n' "$d/db" > "$d/clamd.conf"
          nohup clamd -c "$d/clamd.conf" > "$d/clamd.log" 2>&1 &
          for i in $(seq 1 60); do [ "$(printf 'zPING\0' | nc -w 2 127.0.0.1 3310 | tr -d '\0')" = "PONG" ] && exit 0; sleep 1; done
          cat "$d/clamd.log"; exit 1

      - name: Build Platform Access
        working-directory: services/platform-access
        run: cargo build --workspace --bins --locked

      # Named gates first (a failure names the gate), then the whole workspace.
      - name: Foundation (C) — probes, authentication boundaries, served contract, caching, startup, migrations
        run: cargo test --locked --test foundation --test startup --test migrations --test outbox
      - name: Devices and key directory (C) — proof of possession, KeyPackages, revocation, transparency
        run: cargo test --locked --test devices --test transparency
      # Key-transparency witnesses (AD-05 interface): reference witnesses over real HTTP,
      # quorum cosignatures verified client-side, forged cosignatures dropped, forks /
      # rollbacks refused, a restored (older) database detected and appends failing closed.
      - name: Key-transparency witnesses — quorum cosigning, fork / rollback refusal, restored-backup detection
        run: cargo test --locked --test transparency_witness -- --nocapture
      - name: Conversation domain (D) — profiles, policy, lifecycle, concurrency, isolation, idempotency, sequencing
        run: cargo test --locked --test conversations
      - name: Membership, messages and MLS Delivery Service (Parts E-G prerequisites) — real OpenMLS devices, profile isolation, blocks
        run: cargo test --locked --test messaging
      - name: Realtime gateway (Part E) — client tokens, tickets, WebSocket auth / revocation, subscriptions, replay, ordering, backpressure, broker outage, typing, presence, push, draining
        run: cargo test --locked --test realtime
      # APNs (ES256 provider tokens), FCM HTTP v1 (RS256 service-account OAuth exchange)
      # and Web Push (RFC 8291 encryption, RFC 8292 VAPID, host allowlist) against
      # deterministic local fakes that verify signatures and decrypt. Not live certification.
      - name: Push adapters — APNs, FCM, Web Push against verifying local fakes
        run: cargo test --locked --test push_adapters -- --nocapture
      - name: Realtime across two gateway instances through real Redis (fan-out, presence, revocation)
        run: cargo test --locked --test realtime_redis
      - name: Attachments (Part F) — intents, signed uploads, verification, content security, scanning (real clamd), quotas, grants, E2EE client encryption, lifecycle, legal holds, real MinIO
        run: cargo test --locked --test attachments
      - name: Search, reports, moderation, retention / purge, legal holds, exports, data deletion, regulated contexts, audit (Part G)
        run: cargo test --locked --test compliance
      - name: Integrations (Part V H) — delegated first-party scope, Meeting conversation resolve / fenced membership / lifecycle, LEGACY_MANAGED import
        run: cargo test --locked --test integrations
      - name: SMS Bridge (Part V H §§106–112) — explicit disclosure, never an E2EE downgrade, separate carrier state, inbound MANAGED SMS
        run: cargo test --locked --test sms_bridge
      - name: Engagement and usage (Part V I §113 / §129) — roles, bans, replies / threads, reactions, pins, unread, usage facts without prices
        run: cargo test --locked --test engagement
      - name: Authorization / IDOR matrix (every customer and internal operation; denials change nothing, leak nothing; positives match the contract)
        run: cargo test --locked --test authorization_matrix -- --nocapture

      - name: Webhook relay (Part V I §§116–118) — public events to the existing platform webhook system, never content
        run: cargo test --locked --test webhook_relay
      - name: Query plans (Part V I §§119–122) — every hot query of the new APIs and workers is index-served
        run: cargo test --locked --test query_plans -- --nocapture
      - name: Operations (Part V J) — kill switches, incidents, KT rollback detection, operator CLI
        run: cargo test --locked --test operations
      - name: Disaster recovery (Part V J) — backup / restore with the shipped tooling, KT rollback after restore
        env:
          DISASTER_RECOVERY_CERT_REQUIRED: "1"
        run: cargo test --locked --test disaster_recovery -- --nocapture
      - name: cargo test (whole workspace, incl. the Platform Access certification)
        env:
          PLATFORM_ACCESS_BIN: ${{ github.workspace }}/services/platform-access/target/debug/platform-access
          PLATFORM_ACCESS_MIGRATION_BIN: ${{ github.workspace }}/services/platform-access/target/debug/platform-access-migration
          MESSAGING_E2E_REQUIRED: "1"
        run: cargo test --workspace --no-fail-fast --locked

  build:
    name: service build / migration smoke / isolation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: services/messaging
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/messaging -> target
          key: build

      - name: cargo build
        run: cargo build --workspace --locked

      - name: Migration smoke (up / reset / up)
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/messaging_migration_smoke
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE messaging_migration_smoke"
          ./target/debug/messaging-migration up
          ./target/debug/messaging-migration status
          ./target/debug/messaging-migration reset
          ./target/debug/messaging-migration up
          q() { psql -h 127.0.0.1 -U postgres -d messaging_migration_smoke -tAc "$1"; }
          test "$(q "SELECT count(*) FROM messaging_seaql_migrations")" = "$(grep -c 'Box::new(m20' migration/src/lib.rs)"
          # Only messaging_ tables, and no column that could hold an E2EE secret or plaintext.
          test "$(q "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename !~ '^messaging_'")" = "0"
          # `mls_epoch` (the PUBLIC epoch number of RFC 9420 framing) is the one exact
          # exception; epoch secrets and every other match stay refused.
          test "$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema = 'public' AND column_name ~ '(private|secret|plaintext|epoch|body|content|recovery|attachment_key)' AND column_name <> 'mls_epoch'")" = "0"

      - name: Per-service database roles with the real migrations
        env:
          MESSAGING_MIGRATION_BIN: ${{ github.workspace }}/services/messaging/target/debug/messaging-migration
        run: |
          set -euo pipefail
          test -x "$MESSAGING_MIGRATION_BIN"
          "$GITHUB_WORKSPACE/infra/deployment/postgres/verify-service-isolation.sh" \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres

  docker:
    name: Docker image (repository-root context; never pushed or deployed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f services/messaging/Dockerfile -t cfmeet-messaging:ci .
      - name: image contains only the Messaging binaries and no key material
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint /bin/ls cfmeet-messaging:ci /app | tr '\n' ' ')" = "messaging messaging-migration "
          if docker run --rm --entrypoint /bin/sh cfmeet-messaging:ci -c 'grep -rlI --exclude-dir=proc --exclude-dir=sys -- "PRIVATE KEY-----" / 2>/dev/null'; then
            echo "::error::private key material in the image"; exit 1
          fi
      - name: the container starts and refuses to run without its configuration
        run: |
          set -euo pipefail
          if docker run --rm cfmeet-messaging:ci; then echo "::error::started without configuration"; exit 1; fi
