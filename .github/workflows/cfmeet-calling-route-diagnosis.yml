name: Diagnose CF Meet Calling public route

on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-calling-route-diagnosis.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Compare private proxy and public API (status codes only)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          SECRET=/opt/cfmeet-core/secrets/cfmeet-web-bff.credential
          test -s "$SECRET"
          echo "CALLING_NGINX_INCLUDE: $(grep -Fc 'include /etc/nginx/snippets/cfmeet-calling-routes.conf;' /etc/nginx/sites-enabled/api.cfmeet.com)"
          docker inspect cfmeet-calling-loopback --format 'CALLING_PROXY_RUNNING: {{.State.Running}} PORTS: {{json .HostConfig.PortBindings}}'
          TOKEN="$(cat "$SECRET")"
          for mode in direct public; do
            if test "$mode" = direct; then BASE=http://127.0.0.1:18090; else BASE=https://api.cfmeet.com; fi
            for auth in anonymous credential; do
              for path in /health /v1/calls /v1/calling/endpoints; do
                output="$(mktemp)"
                if test "$auth" = credential; then
                  code="$(curl --silent --show-error --max-time 8 \
                    --resolve api.cfmeet.com:443:127.0.0.1 \
                    -o "$output" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                    "$BASE$path" || true)"
                else
                  code="$(curl --silent --show-error --max-time 8 \
                    --resolve api.cfmeet.com:443:127.0.0.1 \
                    -o "$output" -w '%{http_code}' "$BASE$path" || true)"
                fi
                error_code="$(python3 - "$output" <<'PY'
          import json,sys
          try:
            j=json.load(open(sys.argv[1]))
            print(str(j.get('error',{}).get('code','none'))[:70])
          except Exception:
            print('not-json')
          PY
                )"
                printf 'CHECK mode=%s auth=%s path=%s http=%s error=%s\n' "$mode" "$auth" "$path" "$code" "$error_code"
                rm -f "$output"
              done
            done
          done
          echo "MEETINGS_HEALTH_STATUS: $(curl -s -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:18081/health)"
          REMOTE
