name: Contracts and service auth

# packages/contracts — the contract authority (manifest, JSON Schema 2020-12 and
# OpenAPI 3.x contracts, examples / counter-examples) and its offline validator — and
# packages/service-auth, the internal service authentication library whose conformance
# tests run against those contracts. Neither job starts a service or needs Docker.
#
# The Meeting Service contract (packages/contracts/openapi/meeting-service.json) is
# still regenerated and diffed by backend.yml; this workflow only validates it as a
# registered contract.

on:
  push:
    branches: [main, staging]
    paths:
      - "packages/contracts/**"
      - "packages/service-auth/**"
      - "scripts/contracts/**"
      - "infra/api-gateway/**"
      - "services/meeting-service/src/swagger/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "packages/contracts/**"
      - "packages/service-auth/**"
      - "scripts/contracts/**"
      - "infra/api-gateway/**"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  contracts:
    name: contracts validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts/validator
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/contracts/validator -> target

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Mutation tests: every rule rejects a broken copy of a contract tree.
      - name: validator tests
        run: cargo test --locked --no-fail-fast

      # Manifest, meta-schemas, $id / $ref resolution (offline), examples and
      # counter-examples, OpenAPI documents and their versions.
      - name: validate packages/contracts
        run: cargo run -q --locked -- ../ ../../..

      # Swagger-facing bundles (packages/contracts/bundled/**) are regenerated from the
      # authoritative contracts and must be current and self-contained (no reference to
      # the schemas.cfmeet.com naming host, every local $ref resolves).
      - name: bundled OpenAPI documents are current and self-contained
        working-directory: .
        run: python3 scripts/contracts/bundle_openapi.py --check

      # Part VI §51: the public route manifest of the API Gateway and the public OpenAPI
      # documents are derived from the contracts plus the explicit allow-list; drift, an
      # unclassified operation or an internal / operator / callback leak fails.
      - name: gateway route manifest and public OpenAPI are current
        working-directory: .
        run: python3 scripts/contracts/public_api.py --check

  # The bundles rendered the way a reader meets them: Swagger UI (the version and SRI the
  # Meeting Service serves) in Chromium, the schema host blocked, the whole document
  # resolved by Swagger UI's own resolver, every operation rendered; a negative control
  # (an external $ref) must be reported.
  swagger-render:
    name: Swagger UI renders every bundle (Chromium, schema host blocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/contracts/swagger-render
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/contracts/swagger-render/package-lock.json

      - name: install Playwright Chromium (pinned in package-lock)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: render every bundled OpenAPI document
        run: npm test

  service-auth:
    name: service-auth (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: core, flags: "" }
          - { name: client, flags: "--features client" }
    defaults:
      run:
        working-directory: packages/service-auth
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/service-auth -> target
          key: ${{ matrix.features.name }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --all-targets --locked ${{ matrix.features.flags }}

      - name: cargo clippy
        run: cargo clippy --all-targets --locked ${{ matrix.features.flags }} -- -D warnings

      # Authentication, policy, context, contract conformance (against packages/contracts)
      # and key-generation tests.
      - name: cargo test
        run: cargo test --locked --no-fail-fast ${{ matrix.features.flags }}

      - name: No private key material is committed
        working-directory: .
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(pem|key)$'; then
            echo "::error::a key file is committed"; exit 1
          fi
          python3 - <<'PY'
          import os, re, subprocess, sys
          # A PEM private-key block: header followed by base64 key material (raw or as a
          # "\n"-escaped string literal). Bare header strings in assertions are not keys.
          pem = re.compile(rb"-----BEGIN [A-Z ]*PRIVATE KEY-----(?:\\n|\s)+[A-Za-z0-9+/]{16,}")
          paths = [p.decode() for p in subprocess.run(["git", "ls-files", "-z"], capture_output=True, check=True).stdout.split(b"\0") if p]
          bad = [p for p in paths if os.path.isfile(p) and pem.search(open(p, "rb").read())]
          for p in bad:
              print(f"::error file={p}::private key material is committed")
          sys.exit(1 if bad else 0)
          PY
