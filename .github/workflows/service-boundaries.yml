name: Service boundaries

# Repository-wide data-ownership guard (docs/architecture/service-data-ownership.md):
# no service depends on, includes or reads the source, database or tables of another
# service; shared packages never depend on services. Python standard library only.

# No path filter: the guard and the secret scan are cheap and cover the whole repository
# (root docker-compose.yml, apps/, docs/, .github/ and scripts/ included), so every push
# and pull request is checked.
on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: service-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: service boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Synthetic violations for every rule, and single-violation copies of this
      # repository, must all be rejected.
      - name: guard mutation tests
        run: python3 -m unittest discover -s scripts/service-boundaries -v

      - name: guard
        run: python3 scripts/service-boundaries/check_service_boundaries.py

      # Part I §82: every durable worker responsibility has one owning service, an entry
      # point that exists and tests that prove it.
      - name: operations registry
        run: python3 scripts/service-boundaries/check_operations_registry.py

      # INV-001: every API Gateway route forwards to a handler that exists in the
      # upstream service's axum router (or a declared relay dispatch table). Lives here,
      # not in contracts.yml, because a router refactor in services/** must trigger it.
      - name: gateway upstream handlers exist (mutation tests + gate)
        run: |
          python3 -m unittest scripts/contracts/test_check_gateway_upstreams.py -v
          python3 scripts/contracts/check_gateway_upstreams.py

      # DATA-014: new migrations are well named, append to their migrator's vector and
      # sort last; historical anomalies are frozen in the guard's baseline.
      - name: migration naming and ordering (mutation tests + guard)
        run: |
          python3 -m unittest scripts/migrations/test_check_migration_order.py -v
          python3 scripts/migrations/check_migration_order.py

      - name: no phase-03 path
        run: |
          set -euo pipefail
          if git ls-files | grep -i 'phase-03'; then
            echo "::error::a phase-03 path exists in the repository"; exit 1
          fi

  secret-scan:
    name: repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every rule fires on its own synthetic material; published / placeholder fixtures
      # stay clean; the real tree is clean.
      - name: scanner mutation tests
        run: python3 -m unittest discover -s scripts/secret-scan -v

      - name: scan tracked files
        run: python3 scripts/secret-scan/scan_secrets.py


  # SEC-016: alert rules and Alertmanager routing as code (infra/monitoring). Lives here
  # because a metric rename in services/** must re-run the metric-existence check.
  # Official images pinned by digest; promtool / amtool only, nothing is started or
  # deployed and no receiver is contacted.
  monitoring-rules:
    name: monitoring alert rules
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
      ALERTMANAGER_IMAGE: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Repository policy: severity / approval labels, APPROVAL REQUIRED annotations,
      # runbook links that resolve, every expr metric exported by services/*/src, every
      # critical alert unit-tested, no URL / key / token in the Alertmanager config.
      - name: alert policy checker (mutation tests + gate)
        run: |
          python3 -m unittest discover -s scripts/monitoring -v
          python3 scripts/monitoring/check_alert_rules.py

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/monitoring:ro" -w /monitoring \
            --entrypoint /bin/sh "$PROMETHEUS_IMAGE" -c 'promtool check rules prometheus/rules/*.rules.yml'

      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/monitoring:ro" -w /monitoring \
            --entrypoint /bin/sh "$PROMETHEUS_IMAGE" -c 'promtool test rules prometheus/tests/*.test.yml'

      # The example scrape config reads the meeting-service internal token from a file;
      # an EMPTY placeholder is mounted there so the config (and every rule file it
      # loads) is checked without any token existing.
      - name: promtool check config (example)
        run: |
          : > "$RUNNER_TEMP/empty-placeholder"
          docker run --rm -v "$PWD/infra/monitoring:/monitoring:ro" -w /monitoring \
            -v "$RUNNER_TEMP/empty-placeholder:/etc/prometheus/secrets/meeting-service-internal-api:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" check config prometheus/prometheus.example.yml

      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/infra/monitoring:/monitoring:ro" -w /monitoring \
            --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config alertmanager/alertmanager.yml

  database-isolation:
    name: per-service database roles
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      # Provisions throwaway databases for every service in verify-service-isolation.sh
      # (Calling, Platform Access, ..., Organizations and Meeting-service, SEC-018) with
      # infra/deployment/postgres/provision-service-database.sh and proves least privilege:
      # runtime roles have no DDL, and no role can connect to another service's database.
      # (Each service workflow also applies its REAL migrations through these roles;
      # Meeting-service's are applied in backend.yml.)
      - name: verify service database isolation
        run: |
          infra/deployment/postgres/verify-service-isolation.sh \
            --admin-url postgres://postgres:postgres@127.0.0.1:5432/postgres
