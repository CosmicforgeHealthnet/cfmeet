name: Notification service

# services/notifications — the unified Notification Service (docs/audits/notification-service,
# roadmap N2-N13). It owns its own PostgreSQL database (notif_* tables only) and depends only
# on shared packages (service-auth, notification-client, push-transport, webhooks,
# communications-policy, migration-guard) and its contracts (packages/contracts/notifications).
# It is reached over signed internal HTTP only (plus the Svix-signed Resend callback).
#
# Validation only: deployment is exclusively through cfmeet-coordinated-release.yml.

on:
  push:
    branches: [main, staging]
    paths:
      - "services/notifications/**"
      - "packages/service-auth/**"
      - "packages/notification-client/**"
      - "packages/push-transport/**"
      - "packages/webhooks/**"
      - "packages/communications-policy/**"
      - "packages/migration-guard/**"
      - "packages/contracts/notifications/**"
      - "scripts/migrations/assert_destructive_guard.sh"
      - "scripts/service-boundaries/**"
      - ".github/workflows/notifications.yml"
  pull_request:
    paths:
      - "services/notifications/**"
      - "packages/service-auth/**"
      - "packages/notification-client/**"
      - "packages/push-transport/**"
      - "packages/webhooks/**"
      - "packages/communications-policy/**"
      - "packages/migration-guard/**"
      - "packages/contracts/notifications/**"
      - "scripts/migrations/assert_destructive_guard.sh"
      - "scripts/service-boundaries/**"
      - ".github/workflows/notifications.yml"
  workflow_dispatch:

concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/notifications

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  lint:
    name: fmt / clippy / guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/notifications -> target
          key: lint
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Repository guards (no other service's source; notif_ tables only; nothing logged in clear)
        working-directory: .
        run: |
          set -euo pipefail
          if grep -n -E '"\.\./(calling|communications|platform-access|numbering|privacy-relay|telephony|meeting-service|sms-gateway|messaging|api-gateway|developer-platform|organizations)' \
               services/notifications/Cargo.toml services/notifications/migration/Cargo.toml; then
            echo "::error::services/notifications depends on another service"; exit 1
          fi
          if grep -rn -i -P 'CREATE TABLE (?!notif_)' services/notifications/migration/src; then
            echo "::error::services/notifications creates a table outside its domain"; exit 1
          fi
          # Sensitive values are never fields of a log event (Document 4 §8, CI grep test).
          if grep -rn -E 'tracing::(info|warn|error|debug)!\([^;]*(address = |email = |code = |token = |handle = |subject = |body = )' services/notifications/src; then
            echo "::error::a log statement carries a sensitive field"; exit 1
          fi
      - name: Service boundaries and operations registry
        working-directory: .
        run: |
          set -euo pipefail
          python3 scripts/service-boundaries/check_service_boundaries.py
          python3 scripts/service-boundaries/check_operations_registry.py

  test:
    name: test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/notifications -> target
          key: test
      - name: Unit — catalogue, precedence 1-12, templates parity, providers, Svix, sealing, configuration
        run: cargo test --locked --lib
      - name: Foundation — 17 tables, dark routing, pending-migration refusal, service authentication, HELD
        run: cargo test --locked --test foundation
      - name: Pipeline — ingest, shadow, lanes, leases, suppression, inbox, preferences, push, cancel, reroute
        run: cargo test --locked --test pipeline
      - name: cargo test (whole workspace)
        run: cargo test --workspace --no-fail-fast --locked

  build:
    name: build / migration smoke / config preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/notifications -> target
          key: build
      - name: cargo build
        run: cargo build --workspace --locked
      - name: Destructive migration guard (SEC-015)
        run: bash ../../scripts/migrations/assert_destructive_guard.sh target/debug/notifications-migration
      - name: Migration smoke (up / reset / up)
        env:
          PGPASSWORD: postgres
          APP_ENV: test
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/notifications_migration_smoke
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE notifications_migration_smoke"
          ./target/debug/notifications-migration up
          ./target/debug/notifications-migration reset
          ./target/debug/notifications-migration up
          q() { psql -h 127.0.0.1 -U postgres -d notifications_migration_smoke -tAc "$1"; }
          test "$(q "SELECT count(*) FROM notifications_seaql_migrations")" = "$(grep -c '^mod m20' migration/src/lib.rs)"
          test "$(q "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename <> 'notifications_seaql_migrations' AND tablename !~ '^notif_'")" = "0"
          test "$(q "SELECT count(*) FROM notif_routing WHERE mode <> 'OFF'")" = "0"
      - name: Configuration preflight (--check-config)
        run: |
          set -euo pipefail
          printf '{"bundle_version":1,"receiver":"cfmeet.notifications","runtime_environment":"test","trusted_issuers":[]}' > /tmp/notif-trust.json
          head -c 32 /dev/urandom | base64 > /tmp/notif-data.key
          env="DATABASE_URL=postgres://unused@127.0.0.1/unused CF_RUNTIME_ENVIRONMENT=test CF_SERVICE_TRUST_BUNDLE_FILE=/tmp/notif-trust.json NOTIFICATIONS_DATA_KEY_ID=ci-1 NOTIFICATIONS_DATA_KEY_FILE=/tmp/notif-data.key"
          env $env ./target/debug/notifications --check-config | grep -q '"emailProvider":"none"'
          if env DATABASE_URL=postgres://unused@127.0.0.1/unused CF_RUNTIME_ENVIRONMENT=test CF_SERVICE_TRUST_BUNDLE_FILE=/nonexistent \
               NOTIFICATIONS_DATA_KEY_ID=ci-1 NOTIFICATIONS_DATA_KEY_FILE=/tmp/notif-data.key ./target/debug/notifications --check-config; then
            echo "::error::a missing trust bundle must fail closed"; exit 1
          fi
          if env $env NOTIFICATIONS_RESEND_API_KEY=re_inline ./target/debug/notifications --check-config; then
            echo "::error::inline provider secrets must be refused"; exit 1
          fi

  docker:
    name: Docker image (repository-root context)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        working-directory: .
        run: docker build -f services/notifications/Dockerfile -t cfmeet-notifications:ci .
      - name: image contains only the Notification Service binaries and no key material
        working-directory: .
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint /bin/ls cfmeet-notifications:ci /app | tr '\n' ' ')" = "notifications notifications-migration "
          if docker run --rm --entrypoint /bin/sh cfmeet-notifications:ci -c 'grep -rlI --exclude-dir=proc --exclude-dir=sys -- "PRIVATE KEY-----" / 2>/dev/null'; then
            echo "::error::private key material in the image"; exit 1
          fi
