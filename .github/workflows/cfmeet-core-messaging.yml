name: Deploy CF Meet Messaging privately

# Private deployment only: own migrations, runtime keys, no host port,
# production E2EE remains off, no Meeting Service cutover.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-core-messaging.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cfmeet-core-messaging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_SSH_KEY"
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Migrate and start private Messaging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          ROOT=/opt/cfmeet-core
          SECRETS="$ROOT/secrets"
          NET=cfmeet-core-private
          IMAGE=ghcr.io/cosmicforgehealthnet/cfmeet-messaging:884776b0757109d4ccb84ad25ada7c1a0f5af336
          CONTAINER=cfmeet-messaging
          SIGNING="$SECRETS/messaging-service-auth.pem"
          KT="$SECRETS/messaging-kt-signing.pem"
          TRUST="$SECRETS/messaging-trust.json"
          CLIENT_SIGNING="$SECRETS/messaging-client-token.pem"
          test -s "$SECRETS/messaging-migrator.password" &&
            test -s "$SECRETS/messaging-runtime.password" &&
            test -s "$SIGNING" && test -s "$KT" &&
            docker image inspect "$IMAGE" >/dev/null &&
            docker network inspect "$NET" >/dev/null
          if test ! -s "$CLIENT_SIGNING"; then
            openssl genpkey -algorithm Ed25519 -out "$CLIENT_SIGNING" >/dev/null 2>&1
          fi
          if test ! -s "$TRUST"; then
            printf '%s\n' '{"bundle_version":1,"receiver":"cfmeet.messaging","runtime_environment":"production","trusted_issuers":[]}' > "$TRUST"
          fi
          chown 10001:10001 "$SIGNING" "$KT" "$TRUST" "$CLIENT_SIGNING"
          chmod 0400 "$SIGNING" "$KT" "$TRUST" "$CLIENT_SIGNING"

          PW_MIGRATOR="$(cat "$SECRETS/messaging-migrator.password")"
          PW_RUNTIME="$(cat "$SECRETS/messaging-runtime.password")"
          ENV_FILE="$ROOT/messaging.runtime.env"
          cat > "$ENV_FILE" <<ENV
          DATABASE_URL=postgres://messaging:$PW_RUNTIME@cfmeet-core-db:5432/cfmeet_messaging
          MESSAGING_BIND_ADDRESS=0.0.0.0:8097
          CF_RUNTIME_ENVIRONMENT=production
          CF_SERVICE_AUTH_KEY_ID=messaging-production-1
          CF_SERVICE_AUTH_PRIVATE_KEY_FILE=/run/secrets/messaging-auth.pem
          CF_SERVICE_TRUST_BUNDLE_FILE=/run/secrets/messaging-trust.json
          CF_PLATFORM_ACCESS_BASE_URL=https://api.cfmeet.com:8443
          MESSAGING_KT_LOG_ID=cfmeet.messaging:production
          MESSAGING_KT_SIGNING_KEY_FILE=/run/secrets/messaging-kt.pem
          MESSAGING_CLIENT_TOKEN_SIGNING_KEY_FILE=/run/secrets/messaging-client-token.pem
          MESSAGING_REALTIME_ALLOWED_ORIGINS=https://cfmeet.com,https://www.cfmeet.com
          MESSAGING_REALTIME_REQUIRE_TLS=true
          MESSAGING_E2EE_DEVICES_ENABLED=false
          MESSAGING_PUSH_PROVIDER=none
          LOG_FORMAT=json
          ENV
          chmod 0600 "$ENV_FILE"
          docker run --rm --network "$NET" \
            -e "DATABASE_URL=postgres://messaging_migrator:$PW_MIGRATOR@cfmeet-core-db:5432/cfmeet_messaging" \
            --entrypoint /app/messaging-migration "$IMAGE" up
          unset PW_RUNTIME PW_MIGRATOR

          if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER")" = true ||
              { echo 'Existing Messaging container stopped'; exit 1; }
            test "$(docker inspect --format '{{.Config.Image}}' "$CONTAINER")" = "$IMAGE" ||
              { echo 'Unexpected Messaging image'; exit 1; }
          else
            docker run -d --name "$CONTAINER" --restart unless-stopped \
              --network "$NET" --env-file "$ENV_FILE" \
              --mount type=bind,src="$SIGNING",dst=/run/secrets/messaging-auth.pem,readonly \
              --mount type=bind,src="$KT",dst=/run/secrets/messaging-kt.pem,readonly \
              --mount type=bind,src="$TRUST",dst=/run/secrets/messaging-trust.json,readonly \
              --mount type=bind,src="$CLIENT_SIGNING",dst=/run/secrets/messaging-client-token.pem,readonly \
              "$IMAGE" >/dev/null
          fi
          ports="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$CONTAINER")"
          test "$ports" = 'null' || test "$ports" = '{}' ||
            { echo 'Unexpected Messaging public port'; exit 1; }
          passed=0
          for i in $(seq 1 30); do
            if docker run --rm --network "$NET" curlimages/curl:8.12.1 \
              -fsS --max-time 6 https://api.cfmeet.com:8444/ready >/dev/null 2>&1; then
              passed=1
              break
            fi
            sleep 2
          done
          if test "$passed" != 1; then
            echo 'Messaging readiness failed; no Meeting cutover was attempted'
            docker logs --tail 25 "$CONTAINER" 2>&1 | sed -E 's@(postgres(ql)?://)[^ ]+@\1[REDACTED]@g' || true
            exit 1
          fi
          echo "MESSAGING_PRIVATE_HTTPS_READY: yes"
          echo "MESSAGING_E2EE_PRODUCTION: disabled"
          echo "PUBLIC_HOST_PORTS: none"
          echo "MEETING_SERVICE_RESTARTED: no"
          REMOTE
