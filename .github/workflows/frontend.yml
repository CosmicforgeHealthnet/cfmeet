name: Frontend

# apps/web — the Next.js CF Meet web app (deployed to Vercel, Root Directory apps/web).

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      # Once apps/web consumes generated types from packages/contracts, add:
      # - "packages/contracts/**"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      # Once apps/web consumes generated types from packages/contracts, add:
      # - "packages/contracts/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    name: install / lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      # Device-side Messaging transport: ticket, replay, duplicate, auth boundary.\n      - name: Messaging realtime transport tests\n        run: node --experimental-strip-types --test tests/messaging-realtime.test.mjs\n\n      # Pre-existing ESLint errors were imported from rtc_frontend unchanged.
      # Reported but non-blocking until they are fixed in a dedicated change.
      - name: lint
        continue-on-error: true
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      # No test script is defined in apps/web/package.json; add a step here
      # when one exists.
