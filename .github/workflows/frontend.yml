name: Frontend

# apps/web — the Next.js CF Meet web app (deployed to Vercel, Root Directory apps/web).

on:
  push:
    branches: [main, staging]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      # Once apps/web consumes generated types from packages/contracts, add:
      # - "packages/contracts/**"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend.yml"
      # Once apps/web consumes generated types from packages/contracts, add:
      # - "packages/contracts/**"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  check:
    name: install / lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm ci
        run: npm ci

      # Device-side Messaging transport: ticket, replay, duplicate, auth boundary.
      - name: Messaging realtime transport tests
        run: node --experimental-strip-types --test tests/messaging-realtime.test.mjs

      # A CF Meet browser session may mint a short-lived, device-bound token only
      # through Meeting Service's verified-login bridge, never an internal credential.
      - name: Messaging client session bridge tests
        run: node --experimental-strip-types --test tests/messaging-session.test.mjs

      # The CSP builder (nonce scripts, Trusted Types, no plugins / framing) and a static
      # guard: no DOM XSS sink (innerHTML, dangerouslySetInnerHTML, eval, ...) in src/.
      - name: CSP builder and XSS-sink guard
        run: node --experimental-strip-types --test tests/csp.test.mjs

      # Pre-existing ESLint errors were imported from rtc_frontend unchanged.
      # Reported but non-blocking until they are fixed in a dedicated change.
      - name: lint
        continue-on-error: true
        run: npm run lint

      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1

      # The BUILT app in real Chromium: every page carries a fresh-nonce CSP with Trusted
      # Types and the security headers and hydrates with no violation; injected inline
      # script, untyped DOM sinks, eval and framing are refused.
      - name: Install Chromium (Playwright, pinned in package-lock)
        run: npx playwright install --with-deps chromium

      - name: Browser security — CSP, Trusted Types, XSS sinks, framing (Chromium)
        run: node --test tests/browser-security.test.mjs
