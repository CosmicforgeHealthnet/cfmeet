name: Unified Messaging integration journeys

# Part V H: the Meeting chat migration and the CF Meet identity bridge across the ACTUAL
# service boundaries — real Platform Access and Messaging processes (each with its own
# database and migrations) around Meeting Service's real router and integration
# (services/meeting-service/tests/unified_messaging_e2e.rs), signed internal HTTP between
# them and a real OpenMLS client device. Mandatory scenarios 1 (meeting migration),
# 2 (native identity), 6 (no automatic downgrade: MANAGED stays MANAGED, LEGACY_MANAGED
# provenance) and 7 (failure recovery). Software integration evidence only — no
# production deployment, no external certification.

on:
  push:
    branches: [main, staging]
    paths:
      - "services/privacy-relay/**"
      - "services/sms-gateway/**"
      - "services/calling/**"
      - "packages/webhooks/**"
      - "services/meeting-service/**"
      - "services/messaging/**"
      - "services/platform-access/**"
      - "packages/service-auth/**"
      - "packages/messaging-crypto/**"
      - "packages/contracts/**"
      - "apps/web/**"
      - "scripts/messaging/**"
      - ".github/workflows/unified-messaging-e2e.yml"
  pull_request:
    paths:
      - "services/privacy-relay/**"
      - "services/sms-gateway/**"
      - "services/calling/**"
      - "packages/webhooks/**"
      - "services/meeting-service/**"
      - "services/messaging/**"
      - "services/platform-access/**"
      - "packages/service-auth/**"
      - "packages/messaging-crypto/**"
      - "packages/contracts/**"
      - "apps/web/**"
      - "scripts/messaging/**"
      - ".github/workflows/unified-messaging-e2e.yml"
  workflow_dispatch:

concurrency:
  group: unified-messaging-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # One target directory: every service's binaries next to each other.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  journeys:
    name: Meeting ↔ Messaging ↔ Platform Access (real processes)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      # Missing binaries FAIL here (they only skip on a developer machine).
      UNIFIED_MESSAGING_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: unified-messaging-e2e

      - name: Build the service binaries (Platform Access, Messaging + their migrations)
        run: |
          set -euo pipefail
          for s in platform-access messaging; do
            (cd "services/$s" && cargo build --workspace --bins --locked)
          done

      - name: Journey (Scenarios 1, 2, 6, 7)
        working-directory: services/meeting-service
        env:
          PLATFORM_ACCESS_BIN: ${{ github.workspace }}/target/debug/platform-access
          PLATFORM_ACCESS_MIGRATION_BIN: ${{ github.workspace }}/target/debug/platform-access-migration
          MESSAGING_BIN: ${{ github.workspace }}/target/debug/messaging
          MESSAGING_MIGRATION_BIN: ${{ github.workspace }}/target/debug/messaging-migration
        run: cargo test --locked --test unified_messaging_e2e -- --nocapture

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

  web-client:
    # Part K Milestone B: the SHIPPED CF Meet web Messaging client (the production Next
    # build of apps/web, its pinned browser crypto worker) in Chromium against the real
    # Meeting Service router (production CORS policy), the real Platform Access and
    # Messaging binaries, PostgreSQL, Redis and MinIO: device registration, an E2EE
    # conversation created in the UI, encrypted send / receive, XSS payloads, reload,
    # offline delivery, reconnect, encrypted attachment, a MANAGED conversation, a second
    # device and device-to-device history recovery, device removal, CSP / Trusted Types,
    # a tampered crypto module, an expired session — then Messaging's own database must
    # hold only ciphertext (apps/web/tests/messaging-e2e.browser.mjs, driven by
    # tests/unified_messaging_e2e.rs::web_messaging_client_in_chromium_across_real_services).
    name: Web Messaging client in Chromium (real services)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_REDIS_URL: redis://127.0.0.1:6379
      UNIFIED_MESSAGING_E2E_REQUIRED: "1"
      WEB_MESSAGING_E2E_REQUIRED: "1"
      OBJECT_STORAGE_TEST_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_TEST_ACCESS_KEY: cfmeet-ci
      OBJECT_STORAGE_TEST_SECRET_KEY: cfmeet-ci-only-not-a-secret
      OBJECT_STORAGE_TEST_SSE: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: web-messaging-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start MinIO (private attachment bucket, CORS for the web origin)
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=cfmeet-ci -e MINIO_ROOT_PASSWORD=cfmeet-ci-only-not-a-secret \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          python3 scripts/messaging/s3-create-bucket.py http://127.0.0.1:9000 cfmeet-web-e2e cfmeet-ci cfmeet-ci-only-not-a-secret

      - name: Build the service binaries (Platform Access, Messaging + their migrations)
        run: |
          set -euo pipefail
          for s in platform-access messaging; do
            (cd "services/$s" && cargo build --workspace --bins --locked)
          done

      - name: Production build of the web app for the journey's service URLs
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18080/api/v1
          NEXT_PUBLIC_MESSAGING_URL: http://127.0.0.1:18090
          NEXT_PUBLIC_MESSAGING_STORAGE_URL: http://127.0.0.1:9000
          NEXT_PUBLIC_MESSAGING_POLL_MS: "2000"
          NEXT_PUBLIC_MESSAGING_DEVICE_CHECK_MS: "2000"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Journey (shipped web client, real services)
        working-directory: services/meeting-service
        env:
          PLATFORM_ACCESS_BIN: ${{ github.workspace }}/target/debug/platform-access
          PLATFORM_ACCESS_MIGRATION_BIN: ${{ github.workspace }}/target/debug/platform-access-migration
          MESSAGING_BIN: ${{ github.workspace }}/target/debug/messaging
          MESSAGING_MIGRATION_BIN: ${{ github.workspace }}/target/debug/messaging-migration
          WEB_MESSAGING_E2E_APP: ${{ github.workspace }}/apps/web
        run: cargo test --locked --test unified_messaging_e2e web_messaging_client -- --nocapture

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)

  cross-service:
    # Part V K §§151–154: the three scenarios Parts H–J certified only against scripted
    # peers, now across REAL processes (services/messaging/tests/cross_service_e2e.rs):
    # 4 Privacy Relay revocation, 5 Managed SMS Bridge (deterministic synthetic carrier,
    # no real carrier), 9 webhook privacy (Messaging → Calling → signed customer webhook).
    name: Privacy Relay / SMS Gateway / Calling ↔ Messaging (real processes)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Missing binaries FAIL here (they only skip on a developer machine).
      CROSS_SERVICE_E2E_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-service-e2e

      - name: Build the peer service binaries (+ their migrations)
        run: |
          set -euo pipefail
          for s in platform-access privacy-relay sms-gateway calling; do
            (cd "services/$s" && cargo build --workspace --bins --locked)
          done

      - name: Journeys (Scenarios 4, 5, 9)
        working-directory: services/messaging
        env:
          PLATFORM_ACCESS_BIN: ${{ github.workspace }}/target/debug/platform-access
          PLATFORM_ACCESS_MIGRATION_BIN: ${{ github.workspace }}/target/debug/platform-access-migration
          PRIVACY_RELAY_BIN: ${{ github.workspace }}/target/debug/privacy-relay
          PRIVACY_RELAY_MIGRATION_BIN: ${{ github.workspace }}/target/debug/privacy-relay-migration
          SMS_GATEWAY_BIN: ${{ github.workspace }}/target/debug/sms-gateway
          SMS_GATEWAY_MIGRATION_BIN: ${{ github.workspace }}/target/debug/sms-gateway-migration
          CALLING_BIN: ${{ github.workspace }}/target/debug/calling
          CALLING_MIGRATION_BIN: ${{ github.workspace }}/target/debug/calling-migration
        run: cargo test --locked --test cross_service_e2e -- --nocapture

      - name: Disk usage
        if: always()
        run: df -h / && (du -sh target 2>/dev/null || true)
