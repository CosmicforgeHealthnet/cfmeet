name: CF Meet RTC voicemail and recording Egress certification

# Mandatory real WebRTC + LiveKit Egress + S3-like private store.
# Uses ONLY isolated CI test credentials. No production deployment/keys.
on:
  push:
    # Final closure: also certify capture on staging builds that change Calling or the
    # LiveKit / Egress configuration (it was main-only, so staging CI never captured).
    branches: [main, staging]
    paths:
      - ".github/workflows/cfmeet-rtc-capture-certification.yml"
      - "services/calling/**"
      - "infra/livekit/**"
  workflow_dispatch:

permissions: { contents: read }

concurrency:
  group: cfmeet-rtc-capture-certification
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rtc-capture:
    name: Real Egress voicemail and consent-gated recording
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      CALLING_RTC_CERT_REQUIRED: "1"
      CALLING_RTC_CERT_EGRESS_REQUIRED: "1"
      CALLING_RTC_CERT_LIVEKIT_URL: ws://127.0.0.1:7880
      CALLING_RTC_CERT_LIVEKIT_API_URL: http://127.0.0.1:7880
      CALLING_RTC_CERT_LIVEKIT_API_KEY: calling-cert
      CALLING_RTC_CERT_LIVEKIT_API_SECRET: calling-cert-only-key-not-a-secret-0123456789
      CALLING_RTC_CERT_PYTHON: python
      CALLING_RTC_CERT_EGRESS_S3_ENDPOINT: http://127.0.0.1:9100
      CALLING_RTC_CERT_EGRESS_S3_BUCKET: calling-cert-artifacts
      CALLING_RTC_CERT_EGRESS_S3_ACCESS_KEY: calling-cert-test-store
      CALLING_RTC_CERT_EGRESS_S3_SECRET_KEY: calling-cert-test-store-not-a-secret
      CALLING_RTC_CERT_EGRESS_S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/calling -> target
            services/platform-access -> target
          key: rtc-egress-capture-certification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install real-media and Redis prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends redis-server ffmpeg
          python -m pip install -r services/calling/tests/rtc/requirements.txt
          redis-cli ping >/dev/null || redis-server --port 6379 --bind 127.0.0.1 --save '' --daemonize yes
          redis-cli ping | grep -qx PONG
          command -v ffmpeg
          command -v ffprobe

      - name: Start isolated S3-compatible artifact store
        run: |
          set -euo pipefail
          docker run -d --name calling-capture-store -p 127.0.0.1:9100:9000 \
            -e MINIO_ROOT_USER="$CALLING_RTC_CERT_EGRESS_S3_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$CALLING_RTC_CERT_EGRESS_S3_SECRET_KEY" \
            pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 server /data
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:9100/minio/health/live >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          echo "PRIVATE_CERT_STORAGE: ready"

      - name: Start real LiveKit and Egress
        run: |
          set -euo pipefail
          docker run -d --name calling-capture-livekit --network host \
            -v "$PWD/infra/livekit/egress/livekit.calling-egress-cert.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server:v1.13.9 --config /etc/livekit.yaml
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:7880/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          docker run -d --name calling-capture-egress --network host \
            --cap-add SYS_ADMIN --shm-size=1g \
            -e EGRESS_CONFIG_FILE=/cfg/egress.yaml \
            -v "$PWD/infra/livekit/egress/egress.calling-cert.yaml:/cfg/egress.yaml:ro" \
            livekit/egress:v1.10.0
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:9091/ >/dev/null 2>&1; then ready=1; break; fi
            if test "$(docker inspect -f '{{.State.Running}}' calling-capture-egress)" != true; then
              echo "::error::Real Egress worker exited"
              exit 1
            fi
            sleep 1
          done
          test "$ready" = 1 || { echo "::error::Real Egress not ready"; exit 1; }
          echo 'REAL_LIVEKIT_EGRESS: READY'

      - name: Build Platform Access authority
        working-directory: services/platform-access
        run: |
          set -euo pipefail
          cargo build --workspace --bins --locked
          echo "PLATFORM_ACCESS_BIN=$GITHUB_WORKSPACE/services/platform-access/target/debug/platform-access" >> "$GITHUB_ENV"
          echo "PLATFORM_ACCESS_MIGRATION_BIN=$GITHUB_WORKSPACE/services/platform-access/target/debug/platform-access-migration" >> "$GITHUB_ENV"

      - name: Mandatory RTC voicemail and recording end-to-end certification
        working-directory: services/calling
        run: |
          set -euo pipefail
          cargo test --locked --test rtc_certification -- --nocapture 2>&1 | tee "$RUNNER_TEMP/rtc-capture-certification.log"
          grep -q '^RTC voicemail certified: real WebRTC caller audio -> LiveKit Egress' "$RUNNER_TEMP/rtc-capture-certification.log" ||
            { echo "::error::Real voicemail capture not certified"; exit 1; }
          grep -q '^RTC recording certified: consent-gated, LiveKit Egress mixed audio' "$RUNNER_TEMP/rtc-capture-certification.log" ||
            { echo "::error::Real consent-gated call recording not certified"; exit 1; }
          if grep -q 'SKIPPED: RTC Egress capture' "$RUNNER_TEMP/rtc-capture-certification.log"; then
            echo "::error::RTC capture scenarios were skipped"; exit 1
          fi
          echo "RTC_VOICEMAIL_EGRESS: PASS"
          echo "RTC_RECORDING_CONSENT_EGRESS: PASS"
          echo "RTC_PROTECTED_ARTIFACT_LIFECYCLE: PASS"

      - name: Component state on failure
        if: failure()
        run: |
          docker ps -a --format '{{.Names}} {{.Status}}' |
            grep -E '^calling-capture-' || true

# Re-run after preserving >=3s real recording invariant with 9s microphone window.
