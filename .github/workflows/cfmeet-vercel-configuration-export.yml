name: Export CF Meet Calling setup to Vercel securely

on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-vercel-configuration-export.yml"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  secure-export:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Set up SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Export non-secret UUIDs and encrypted one-time credential
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          PUB="$(mktemp)"
          CIPHER="$(mktemp)"
          trap 'rm -f "$PUB" "$CIPHER"' EXIT
          printf '%s\n' '' | base64 -d > "$PUB"
          test -s /opt/cfmeet-core/secrets/cfmeet-web-bff.credential
          test -s /opt/cfmeet-core/communication.scope.env
          openssl pkeyutl -encrypt -pubin -inkey "$PUB" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /opt/cfmeet-core/secrets/cfmeet-web-bff.credential -out "$CIPHER"
          echo "CFMEET_ENCRYPTED_BFF_CREDENTIAL=$(base64 -w0 "$CIPHER")"
          grep -E '^CFMEET_COMMUNICATION_(TENANT|APPLICATION|ENVIRONMENT)_ID=' \
            /opt/cfmeet-core/communication.scope.env
          echo 'CREDENTIAL_IS_ENCRYPTED: yes'
          REMOTE
