name: Activate independent CF Meet Calling LiveKit API key

# Preserves Meetings API key and all configuration; refuses to restart
# LiveKit when there are any active participants.
on:
  push:
    branches: [main]
    paths: [".github/workflows/cfmeet-calling-livekit-key.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: cfmeet-calling-livekit-key
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 18
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 7 -H "$VPS_HOST" > ~/.ssh/known_hosts
      - name: Provision isolated media key and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          CONF=/opt/livekit/livekit.yaml
          BAK=/opt/livekit/livekit.yaml.pre-cfmeet-calling
          S=/opt/cfmeet-core/secrets
          KEYFILE="$S/calling-livekit-api-key"
          SECRETFILE="$S/calling-livekit-api-secret"
          test -s "$CONF" && test -d "$S"
          test "$(docker inspect -f '{{.State.Running}}' lk-server)" = true
          test "$(docker inspect -f '{{.State.Running}}' cfmeet-production-backend)" = true

          # Count participants from LiveKit with the existing Meetings key.
          # Only emit counts; JWT and credential values remain in process memory.
          docker inspect cfmeet-production-backend --format '{{range .Config.Env}}{{println .}}{{end}}' |
            python3 -c '
          import sys,base64,hashlib,hmac,json,time,urllib.request
          env={}
          for line in sys.stdin:
              if "=" in line:
                  k,v=line.rstrip("\n").split("=",1)
                  if k in ("LIVEKIT_API_KEY","LIVEKIT_API_SECRET"): env[k]=v
          assert env.get("LIVEKIT_API_KEY") and env.get("LIVEKIT_API_SECRET"), "Missing Meetings key"
          b=lambda z:base64.urlsafe_b64encode(z).decode().rstrip("=")
          now=int(time.time())
          h=b(b"{\"alg\":\"HS256\",\"typ\":\"JWT\"}")
          p=b(json.dumps({"iss":env["LIVEKIT_API_KEY"],"nbf":now-2,"iat":now,"exp":now+60,"sub":"calling-restart-safety","video":{"roomList":True}},separators=(",",":")).encode())
          t=h+"."+p
          sig=b(hmac.new(env["LIVEKIT_API_SECRET"].encode(),t.encode(),hashlib.sha256).digest())
          req=urllib.request.Request("http://127.0.0.1:7880/twirp/livekit.RoomService/ListRooms",data=b"{}",method="POST",headers={"Authorization":"Bearer "+t+"."+sig,"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=8) as r: rooms=json.load(r).get("rooms",[])
          count=sum(int(x.get("numParticipants",x.get("num_participants",0))) for x in rooms)
          print("PRE_RESTART_ACTIVE_PARTICIPANTS:",count)
          if count: raise SystemExit("LiveKit restart refused: participants currently connected")
          '
          # Never regenerate a deployed Calling key on reruns.
          if test ! -s "$KEYFILE"; then
            printf 'CFCALL%s\n' "$(openssl rand -hex 10)" > "$KEYFILE"
          fi
          if test ! -s "$SECRETFILE"; then
            openssl rand -hex 32 > "$SECRETFILE"
          fi
          chown 10001:10001 "$KEYFILE" "$SECRETFILE"
          chmod 0400 "$KEYFILE" "$SECRETFILE"
          if ! test -f "$BAK"; then cp -p "$CONF" "$BAK"; fi

          # Keep existing Meetings key exactly as-is. Add just Calling's pair.
          python3 - "$CONF" "$KEYFILE" "$SECRETFILE" <<'PY'
          import pathlib,re,sys
          path,kfile,sfile=map(pathlib.Path,sys.argv[1:])
          key=kfile.read_text().strip()
          secret=sfile.read_text().strip()
          assert re.fullmatch(r'CFCALL[a-f0-9]{20}',key)
          assert re.fullmatch(r'[a-f0-9]{64}',secret)
          original=path.read_text()
          ls=original.splitlines(keepends=True)
          indices=[i for i,line in enumerate(ls) if re.fullmatch(r'keys:\s*',line.rstrip('\n'))]
          assert len(indices)==1, "Expected exactly one YAML keys mapping"
          idx=indices[0]
          end=next((i for i in range(idx+1,len(ls)) if ls[i].strip() and not ls[i].startswith((' ','\t','#'))),len(ls))
          block=''.join(ls[idx+1:end])
          assert len(re.findall(r'^\s{2,}\S+:\s*\S+',block,re.M))>=1, "Existing Meetings key missing"
          if re.search(r'^\s+'+re.escape(key)+r':',block,re.M):
              assert re.search(r'^\s+'+re.escape(key)+r':\s*'+re.escape(secret)+r'\s*$',block,re.M), "Existing Calling key mismatch"
              print("CALLING_API_KEY_ALREADY_CONFIGURED: yes")
          else:
              ls.insert(idx+1,'  '+key+': '+secret+'\n')
              path.write_text(''.join(ls))
              print("CALLING_API_KEY_ADDED: yes")
          PY

          # Only LiveKit is restarted; if validation fails, restore original
          # config and immediately restart again to preserve Meetings.
          recover() {
            rc=$?
            trap - ERR
            cp -p "$BAK" "$CONF"
            docker restart lk-server >/dev/null || true
            echo "LIVEKIT_CONFIG_RESTORED: yes"
            exit "$rc"
          }
          trap recover ERR
          docker restart lk-server >/dev/null
          for i in $(seq 1 25); do
            if curl -s -o /dev/null --max-time 5 http://127.0.0.1:7880/; then break; fi
            sleep 2
          done
          # Verify the dedicated key is recognized by the live server, not
          # merely written to YAML. No key/token is printed.
          python3 - "$KEYFILE" "$SECRETFILE" <<'PY'
          import base64,hashlib,hmac,json,pathlib,sys,time,urllib.request
          key=pathlib.Path(sys.argv[1]).read_text().strip()
          secret=pathlib.Path(sys.argv[2]).read_text().strip()
          b=lambda z:base64.urlsafe_b64encode(z).decode().rstrip('=')
          now=int(time.time())
          t=b(b'{"alg":"HS256","typ":"JWT"}')+'.'+b(json.dumps({'iss':key,'nbf':now-1,'iat':now,'exp':now+60,'sub':'calling-key-verifier','video':{'roomList':True}},separators=(',',':')).encode())
          token=t+'.'+b(hmac.new(secret.encode(),t.encode(),hashlib.sha256).digest())
          req=urllib.request.Request('http://127.0.0.1:7880/twirp/livekit.RoomService/ListRooms',data=b'{}',method='POST',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=9) as r:
              assert isinstance(json.load(r).get('rooms',[]),list)
          print('CALLING_LIVEKIT_API_KEY_VERIFIED: yes')
          PY
          if ! docker network inspect cfmeet-core-private >/dev/null; then exit 1; fi
          if ! docker inspect lk-server --format '{{range $k,$v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | grep -Fxq cfmeet-core-private; then
            docker network connect cfmeet-core-private lk-server
          fi
          trap - ERR
          echo 'MEETING_LIVEKIT_KEY: PRESERVED'
          echo 'CALLING_LIVEKIT_KEY: SEPARATE'
          echo 'LIVEKIT_CONNECTED_TO_PRIVATE_CORE_NETWORK: yes'
          echo 'PSTN: DISABLED'
          REMOTE
