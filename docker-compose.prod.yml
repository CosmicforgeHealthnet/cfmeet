# =============================================================================
# CF Meet Production Stack
#
# Usage:
#   1. Copy this file to your production server
#   2. Create .env file with production values
#   3. Create livekit.yaml with your VPS IP
#   4. Create nginx/ directory with config files (see docs/INFRASTRUCTURE.md)
#   5. Run: docker compose -f docker-compose.prod.yml up -d --build
#
# See docs/INFRASTRUCTURE.md for complete setup instructions.
# =============================================================================

name: cfmeet-production

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cfmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cfmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-cfmeet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cfmeet-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfmeet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cfmeet-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - cfmeet-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # LiveKit Media Server
  # ---------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    container_name: cfmeet-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # HTTP API
      - "7881:7881"       # RTC over TCP
      - "7882:7882"       # TURN/TLS
      - "3478:3478/udp"   # TURN UDP
      - "5349:5349/tcp"   # TURN TLS
      - "50000-60000:50000-60000/udp"  # WebRTC UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - ./ssl:/etc/livekit/ssl:ro
    networks:
      - cfmeet-internal
      - cfmeet-external

  # ---------------------------------------------------------------------------
  # Meeting Service (Backend API)
  # ---------------------------------------------------------------------------
  meeting-service:
    build:
      context: ./services/meeting-service
      dockerfile: Dockerfile
    image: cfmeet-meeting-service:latest
    container_name: cfmeet-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - LIVEKIT_URL=${LIVEKIT_URL:?LIVEKIT_URL is required}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      - APP_URL=${APP_URL:?APP_URL is required}
      - FRONTEND_URLS=${FRONTEND_URLS:?FRONTEND_URLS is required}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-CF Meet}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
      - RUST_LOG=${RUST_LOG:-info,backend=info}
      - HOST=0.0.0.0
      - PORT=8080
      - FEATURE_MEETING_V2_ENABLED=${FEATURE_MEETING_V2_ENABLED:-true}
      - FEATURE_WAITING_ROOM_V2_ENABLED=${FEATURE_WAITING_ROOM_V2_ENABLED:-true}
    command: ["sh", "-c", "./migration up && ./server"]
    networks:
      - cfmeet-internal
      - cfmeet-external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: cfmeet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - cfmeet-external
    depends_on:
      - meeting-service
      - livekit

  # ---------------------------------------------------------------------------
  # Certbot for SSL
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot
    container_name: cfmeet-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

networks:
  cfmeet-internal:
    driver: bridge
  cfmeet-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
