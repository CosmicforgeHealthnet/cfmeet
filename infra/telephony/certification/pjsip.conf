; Certification topology (all loopback):
;   127.0.0.1:5070   edge SIP transport (UDP)
;   127.0.0.2:5080   simulated carrier A (SIPp)   -> endpoint peer-ng-a (identified by IP)
;   127.0.0.4:5080   simulated carrier B (SIPp)   -> endpoint peer-ng-b
;   127.0.0.3:5090   simulated application-media side (SIPp)  -> endpoint app-media
; Any other source is unidentified and rejected (no anonymous endpoint).
[global]
type = global
endpoint_identifier_order = ip

[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5070

; --- Carrier trunk A --------------------------------------------------------
[peer-ng-a]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
; Never propagate party identity across a bridge (privacy) and no re-INVITE storms.
send_connected_line = no
trust_connected_line = no
send_rpid = yes
trust_id_outbound = yes
aors = peer-ng-a

[peer-ng-a]
type = aor
contact = sip:127.0.0.2:5080

[peer-ng-a]
type = identify
endpoint = peer-ng-a
match = 127.0.0.2

; --- Carrier trunk B (failover) ---------------------------------------------
[peer-ng-b]
type = endpoint
transport = transport-udp
context = from-trunk
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
; Never propagate party identity across a bridge (privacy) and no re-INVITE storms.
send_connected_line = no
trust_connected_line = no
send_rpid = yes
trust_id_outbound = yes
aors = peer-ng-b

[peer-ng-b]
type = aor
contact = sip:127.0.0.4:5080

[peer-ng-b]
type = identify
endpoint = peer-ng-b
match = 127.0.0.4

; --- Application media side (internal peer) ---------------------------------
[app-media]
type = endpoint
transport = transport-udp
context = from-app-media
disallow = all
allow = ulaw,alaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
; Never propagate party identity across a bridge (privacy) and no re-INVITE storms.
send_connected_line = no
trust_connected_line = no

[app-media]
type = identify
endpoint = app-media
match = 127.0.0.3

; --- Part F: an enterprise SIP device (desk phone simulated by SIPp) ---------
; Internal only: identified like the other certification peers (production devices
; authenticate with credentials held in the edge's secret store). Its context hands
; every dialog to Telephony's control application — no dialplan routing.
[ent-desk-1]
type = endpoint
transport = transport-udp
context = from-enterprise-device
disallow = all
allow = alaw,ulaw
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
send_connected_line = no
trust_connected_line = no
aors = ent-desk-1

[ent-desk-1]
type = aor
contact = sip:127.0.0.5:5080

[ent-desk-1]
type = identify
endpoint = ent-desk-1
match = 127.0.0.5
