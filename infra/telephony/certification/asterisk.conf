; CF Meet SIP / media edge — CERTIFICATION configuration (loopback only).
; `@RUNDIR@` is replaced by the certification harness with a private temporary directory.
; Never used for deployment: see ../asterisk/ for the deployment templates.
[directories]
astetcdir => @RUNDIR@/etc
astmoddir => /usr/lib/x86_64-linux-gnu/asterisk/modules
astvarlibdir => @RUNDIR@/varlib
astdbdir => @RUNDIR@/varlib
astkeydir => @RUNDIR@/varlib
astdatadir => /usr/share/asterisk
astagidir => @RUNDIR@/agi
astspooldir => @RUNDIR@/spool
astrundir => @RUNDIR@/run
astlogdir => @RUNDIR@/log
astsbindir => /usr/sbin

[options]
nofork = yes
transmit_silence = yes
