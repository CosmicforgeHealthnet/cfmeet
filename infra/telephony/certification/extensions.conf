; Every dialog goes straight into Telephony's control application. No dialplan routing,
; no default context, no outbound dialling from the dialplan (toll-fraud boundary):
; only Telephony originates, through ARI.
[general]
static = yes
writeprotect = yes

[from-trunk]
exten => _[+0-9].,1,Stasis(cfmeet-cert,inbound)
 same => n,Hangup(21)
exten => _X.,1,Stasis(cfmeet-cert,inbound)
 same => n,Hangup(21)

[from-app-media]
exten => _cfmj.,1,Stasis(cfmeet-cert,appmedia)
 same => n,Hangup(21)

[default]
exten => _X.,1,Hangup(21)
