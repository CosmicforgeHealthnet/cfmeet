; ARI / HTTP: the SIP control plane. PRIVATE interface only — never internet-exposed.
; TLS terminates here when the control network is not a single host.
[general]
enabled = yes
bindaddr = <private-control-ip>
bindport = 8088
; tlsenable = yes
; tlsbindaddr = <private-control-ip>:8089
; tlscertfile = /run/secrets/edge/ari-tls.crt
; tlsprivatekey = /run/secrets/edge/ari-tls.key
