; EXAMPLE of a generated trunk file (/run/secrets/edge/trunks/<peer-id>.conf). The
; endpoint name MUST equal Telephony's sip_peer_config_refs.id; the values come from the
; secret named by its secret_ref. Never commit a filled-in copy.
[<peer-id>](trunk-defaults)
transport = transport-tls
outbound_auth = <peer-id>-auth
aors = <peer-id>

[<peer-id>-auth]
type = auth
auth_type = userpass
username = <from-secret-store>
password = <from-secret-store>

[<peer-id>]
type = aor
contact = sip:<carrier-sbc-host>:5061;transport=tls
qualify_frequency = 30

[<peer-id>]
type = identify
endpoint = <peer-id>
match = <carrier-signalling-cidr-1>
match = <carrier-signalling-cidr-2>
