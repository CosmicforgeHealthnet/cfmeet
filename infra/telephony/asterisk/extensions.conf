; Every dialog goes straight into Telephony's control application. There is NO dialplan
; dialling: only Telephony originates (through ARI), after authorization, policy, spend
; and capacity checks (toll-fraud boundary). Unidentified traffic never reaches here.
[general]
static = yes
writeprotect = yes

[from-trunk]
exten => _[+0-9].,1,Stasis(cfmeet-telephony,inbound)
 same => n,Hangup(21)
exten => _X.,1,Stasis(cfmeet-telephony,inbound)
 same => n,Hangup(21)

[from-app-media]
exten => _cfmj.,1,Stasis(cfmeet-telephony,appmedia)
 same => n,Hangup(21)

[default]
exten => _X.,1,Hangup(21)
