; The ARI user Telephony authenticates as. Its password is NOT here: the deployment writes
; /run/secrets/edge/ari-users.conf (mode 0600) from the secret store and the same value
; into the file named by TELEPHONY_ARI_PASSWORD_FILE.
[general]
enabled = yes
pretty = no
allowed_origins =

#include /run/secrets/edge/ari-users.conf
