; SIP transports and peers. Carrier trunks are generated per interconnect from
; /run/secrets/edge/trunks/*.conf (credentials, peer addresses) — see ../README.md.
[global]
type = global
endpoint_identifier_order = ip,username
; No anonymous endpoint: unidentified sources are refused.

; Public SIP ingress (carriers only, firewall allowlisted, TLS where the carrier supports it).
[transport-tls]
type = transport
protocol = tls
bind = <public-sip-ip>:5061
cert_file = /run/secrets/edge/sip-tls.crt
priv_key_file = /run/secrets/edge/sip-tls.key
method = tlsv1_2

[transport-udp-carrier]
type = transport
protocol = udp
bind = <public-sip-ip>:5060

; Internal media peer (the RTC media gateway's SIP side), private network only.
[transport-internal]
type = transport
protocol = udp
bind = <private-media-ip>:5070

[trunk-defaults](!)
type = endpoint
context = from-trunk
disallow = all
allow = alaw,ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
dtmf_mode = rfc4733
send_connected_line = no
trust_connected_line = no
send_rpid = yes
trust_id_outbound = yes
; Bound concurrent dialogs per peer (also enforced by Telephony capacity).
device_state_busy_at = 100

[app-media]
type = endpoint
transport = transport-internal
context = from-app-media
disallow = all
allow = alaw,ulaw,opus
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
send_connected_line = no
trust_connected_line = no

[app-media]
type = identify
endpoint = app-media
match = <rtc-media-gateway-cidr>

#include /run/secrets/edge/trunks/*.conf
