# CI-only: one LiveKit shared by two applications, as in production (Meetings and
# Calling keys). Test-only, well-known credentials; never a deployment secret.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  meetings-topology: meetings-topology-only-key-not-a-secret-0123456789
  calling-topology: calling-topology-only-key-not-a-secret-0123456789
room:
  auto_create: true
logging:
  level: info
