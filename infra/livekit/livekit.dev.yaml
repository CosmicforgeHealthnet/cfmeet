# LiveKit server configuration for LOCAL DEVELOPMENT ONLY.
# Used by the root docker-compose.yml. Never use these keys in any shared
# or production environment.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  # Advertise loopback so browsers on the developer machine can connect.
  node_ip: 127.0.0.1
keys:
  # Well-known LiveKit development key pair (same as `livekit-server --dev`).
  devkey: secret
logging:
  level: info
