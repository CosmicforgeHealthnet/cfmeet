# CF Meet service database catalog for the backup tooling (SEC-010).
#
# One line per service-owned PostgreSQL database. Columns are separated by whitespace;
# lists are comma separated; "-" means none.
#
#   service            the --service name used by every script in this directory
#   status             active   = may be backed up / restored
#                      reserved = slot kept for a service that does not exist yet; every
#                                 script refuses it until the line is switched to active
#   required_history   migration-history tables that MUST exist and be non-empty. Their
#                      presence proves a URL points at this service's database (a backup of
#                      the wrong database is refused).
#   optional_history   additive migration histories that exist only after a later release
#                      (e.g. the Communications integrations, the Sections 9-23 facades).
#                      Recorded with their row counts when present; a restore must then
#                      reproduce them exactly.
#   identity_tables    data tables that must also exist (meeting-service uses the default
#                      `seaql_migrations` name, so `users` + `meetings` disambiguate it).
#
# Keep this file in step with services/*/migration/src (migration_table_name) and with
# infra/deployment/postgres/provision-service-database.sh. Production database names are
# listed in docs/operations/backup-and-restore.md.
#
# service            status    required_history                     optional_history                                                            identity_tables
meeting-service      active    seaql_migrations                     account_communications_migrations,account_communications_facade_migrations,account_security_migrations,meetings_calendar_migrations,profile_notifications_migrations,account_hardening_migrations  users,meetings
communications       active    communications_seaql_migrations      communications_unified_seaql_migrations,communications_device_session_seaql_migrations  communication_profiles
developer-platform   active    developer_platform_seaql_migrations  -                                                                           -
platform-access      active    platform_access_seaql_migrations     -                                                                           -
calling              active    calling_seaql_migrations             calling_communications_migrations                                           -
messaging            active    messaging_seaql_migrations           messaging_communications_migrations                                         -
numbering            active    numbering_seaql_migrations           -                                                                           -
privacy-relay        active    privacy_relay_seaql_migrations       -                                                                           -
telephony            active    telephony_seaql_migrations           -                                                                           -
sms-gateway          active    sms_gateway_seaql_migrations         -                                                                           -
# Organizations authority (Blueprint Sections 3-5, services/organizations).
organizations        active    organizations_seaql_migrations       -                                                                           -
