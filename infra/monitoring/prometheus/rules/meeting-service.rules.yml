# Prometheus alerting rules for services/meeting-service (SEC-016).
#
# Source of the policy: docs/phase2-certification/14-operational-runbook.md
# "Alerts and severity (§84)". Every metric below is exported by GET /internal/metrics
# (services/meeting-service/src/handlers/internal.rs): `meeting_join_*` from the telemetry
# sink (services/quality/sink.rs) and `cfmeet_rtc_*_total`, `cfmeet_collab_*_total`,
# `cfmeet_ops_*_total` synthesized from the counters! lists in services/rtc_metrics.rs,
# services/collaboration/metrics.rs and services/ops_metrics.rs.
#
# Labels (enforced by scripts/monitoring/check_alert_rules.py):
#   severity  critical | warning | info            (runbook §84 column "Severity")
#   approval  documented                            threshold stated concretely in a runbook
#             required                              runbook says APPROVAL REQUIRED (or gives
#                                                   no value): the expression holds a
#                                                   starting point, not an approved SLA
#   service   the owning service
#
# Conditions the exposition cannot express (no metric; SQL-only checks) are approximated
# by the nearest exported signal and say so in their description. See
# docs/operations/monitoring-alerts.md for the full table and the owner approval steps.
#
# Job name: `up{job="meeting-service"}` assumes the scrape job is named meeting-service
# (see ../prometheus.example.yml).

groups:
  - name: meeting-service.alerts
    rules:
      # ---------------------------------------------------------------- CRITICAL
      - alert: MeetingServiceUnavailable
        expr: |
          up{job="meeting-service"} == 0
        for: 2m
        labels:
          severity: critical
          approval: documented
          service: meeting-service
        annotations:
          summary: "meeting-service metrics endpoint unreachable for 2 minutes"
          description: "Prometheus cannot scrape meeting-service /internal/metrics (process down, unreachable, or INTERNAL_API_TOKEN mismatch answering 404). Nearest available signal for the runbook condition 'Database unavailable': /health does not check PostgreSQL and no metric counts 503 SERVICE_UNAVAILABLE, so a database outage alone is not visible in the exposition."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#join-failures"

      - alert: MeetingJoinSuccessRateLow
        expr: |
          (
            sum(rate(meeting_join_success_total[5m]))
            /
            (
              sum(rate(meeting_join_success_total[5m]))
              + (sum(rate(meeting_join_failure_total{outcome=~"provider_failure|timeout|client_failure"}[5m])) or vector(0))
            )
          ) < 0.90
        for: 5m
        labels:
          severity: critical
          approval: required
          service: meeting-service
        annotations:
          summary: "Join success rate below the starting-point target (90 % for 5 minutes)"
          description: "Successful joins divided by successful plus failed joins (provider_failure, timeout, client_failure). Denials and waiting-room outcomes are excluded from the SLI, as the runbook requires. No traffic yields no alert."
          threshold_status: "APPROVAL REQUIRED: starting point from 14-operational-runbook.md §84 (< 90 % for 5 min), not an approved SLA"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#join-failures"

      - alert: MeetingRtcProviderUnavailableForJoins
        expr: |
          (
            sum(rate(meeting_join_failure_total{outcome="provider_failure"}[5m]))
            /
            (
              sum(rate(meeting_join_success_total[5m]))
              + sum(rate(meeting_join_failure_total{outcome=~"provider_failure|timeout|client_failure"}[5m]))
            )
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          approval: required
          service: meeting-service
        annotations:
          summary: "RTC_PROVIDER_UNAVAILABLE dominates join outcomes"
          description: "More than half of non-denied join attempts end with provider_failure (RTC_PROVIDER_UNAVAILABLE) for 5 minutes. Check cfmeet_rtc_provider_errors_total and LiveKit reachability."
          threshold_status: "APPROVAL REQUIRED: 14-operational-runbook.md §84 gives no value; 50 % share for 5 min is a repository placeholder for 'dominate', not an approved SLA"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#livekit-outage"

      - alert: MeetingConferenceTerminationFailing
        expr: |
          sum(rate(cfmeet_rtc_room_terminate_failures_total[5m])) > 0
        for: 10m
        labels:
          severity: critical
          approval: required
          service: meeting-service
        annotations:
          summary: "Provider room termination failing for 10 minutes (conferences stay ENDING)"
          description: "Nearest available signal for the runbook condition 'Large stuck ENDING backlog': the count of conference_sessions in ENDING is SQL-only and not exported. Continuous room termination failures keep conferences in ENDING (the reconciler never marks ENDED without confirmed absence)."
          threshold_status: "APPROVAL REQUIRED: 14-operational-runbook.md §84 asks for an approved ENDING-older-than-10-min count; this proxy (any termination failure sustained for 10 min) is a repository placeholder"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#stuck-ending-conference"

      - alert: MeetingOutboxDeadLettersIncreasing
        expr: |
          sum(rate(cfmeet_rtc_outbox_dead_lettered_total[5m])) > 0
        for: 10m
        labels:
          severity: critical
          approval: documented
          service: meeting-service
        annotations:
          summary: "Outbox dead letters increasing for 10 minutes"
          description: "outbox_events rows keep moving to FAILED (dead letter). Inspect them before any re-queue."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#outbox-backlog"

      - alert: MeetingOutboxRetriesWithoutProgress
        expr: |
          sum(rate(cfmeet_rtc_outbox_retried_total[5m])) > 0
          and
          sum(rate(cfmeet_rtc_outbox_published_total[5m])) == 0
        for: 10m
        labels:
          severity: critical
          approval: documented
          service: meeting-service
        annotations:
          summary: "Outbox retrying without publishing anything for 10 minutes"
          description: "Nearest available signal for 'PENDING older than 5 min growing': the PENDING backlog is SQL-only (it is in the JSON /internal/rtc/metrics, not in the Prometheus exposition). A stopped relay (no retries, no publishes) is not detectable from counters; use the runbook SQL."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#outbox-backlog"

      - alert: MeetingRecordingFailureRatioHigh
        expr: |
          (
            sum(increase(cfmeet_ops_recording_failed_total[1h]))
            /
            sum(increase(cfmeet_ops_recording_requested_total[1h]))
          ) > 0.25
        for: 15m
        labels:
          severity: critical
          approval: required
          service: meeting-service
        annotations:
          summary: "Systemic recording / storage failure: recording_failed / recording_requested above 25 % over 1 hour"
          description: "Critical only where recording is business-critical (runbook §84); the owner may demote it to warning. No requests in the window yields no alert."
          threshold_status: "APPROVAL REQUIRED: 14-operational-runbook.md §84 gives no value; 25 % over 1 h for 15 min is a repository placeholder, not an approved SLA"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#recording-failure"

      # ----------------------------------------------------------------- WARNING
      - alert: MeetingJoinLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(meeting_join_latency_seconds_bucket[5m]))) > 3
        for: 10m
        labels:
          severity: warning
          approval: required
          service: meeting-service
        annotations:
          summary: "Join p95 latency above 3 seconds for 10 minutes"
          description: "p95 of join request to credential issued (meeting_join_latency_seconds). Compare with meeting_join_media_latency_seconds to separate API from media-path problems."
          threshold_status: "APPROVAL REQUIRED: 14-operational-runbook.md §84 gives no value; p95 > 3 s for 10 min is a repository placeholder, not an approved SLA"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#join-failures"

      - alert: MeetingRtcDriftEscalated
        expr: |
          sum(increase(cfmeet_rtc_drift_escalated_total[1h])) > 0
        labels:
          severity: warning
          approval: documented
          service: meeting-service
        annotations:
          summary: "Provider drift escalated in the last hour"
          description: "The reconciler found drift it must not guess about (for example a cf-* room with no conference). Manual action only after confirming in PostgreSQL."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#orphan-rtc-room"

      - alert: MeetingShadowMismatches
        expr: |
          sum(increase(cfmeet_ops_shadow_mismatches_total[1h])) > 0
        labels:
          severity: warning
          approval: required
          service: meeting-service
        annotations:
          summary: "Legacy / v2 shadow mismatches observed in the last hour"
          description: "Only meaningful while FEATURE_MEETING_V2_SHADOW_READ=true during migration observation."
          threshold_status: "APPROVAL REQUIRED: 14-operational-runbook.md §84 gives no value; any mismatch in 1 h is a repository placeholder"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#migration-mismatch"

      - alert: MeetingRealtimeDegraded
        expr: |
          sum(rate(cfmeet_rtc_ws_resync_required_total[5m])) > 0
          or
          sum(rate(cfmeet_collab_reactions_dropped_total[5m])) > 0
        for: 15m
        labels:
          severity: warning
          approval: required
          service: meeting-service
        annotations:
          summary: "WebSocket resyncs or dropped reactions sustained for 15 minutes (Redis fanout degraded)"
          description: "resync_required is sent when a client cannot resume gap-free; reactions are dropped when Redis fanout is unavailable. REST and PostgreSQL authority are unaffected."
          threshold_status: "APPROVAL REQUIRED: the 15 min duration is from 14-operational-runbook.md §84; the spike magnitude is not stated, so any sustained rate is a repository placeholder"
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#redis-outage"

      - alert: MeetingArtifactFinalizationStuck
        expr: |
          sum(rate(cfmeet_ops_artifact_finalize_retries_total[5m])) > 0
        for: 30m
        labels:
          severity: warning
          approval: documented
          service: meeting-service
        annotations:
          summary: "Artefact finalizer retrying for 30 minutes (artefacts stuck STOPPING / PROCESSING)"
          description: "Nearest available signal for 'artefacts stuck STOPPING / PROCESSING > 30 min': artefact status age is SQL-only. Continuous finalize retries for 30 min mean at least one artefact has not reached READY or FAILED."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#artifact-stuck-processing"

      # -------------------------------------------------------------------- INFO
      - alert: MeetingRtcDriftRepaired
        expr: |
          sum(increase(cfmeet_rtc_drift_repaired_total[1h])) > 0
        labels:
          severity: info
          approval: documented
          service: meeting-service
        annotations:
          summary: "Reconciler repaired provider drift in the last hour"
          description: "Informational: the reconciler brought the provider back in line with PostgreSQL."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#alerts-and-severity-84"

      - alert: MeetingLegacyWritesRejected
        expr: |
          sum(increase(cfmeet_ops_legacy_writes_rejected_total[1h])) > 0
        labels:
          severity: info
          approval: documented
          service: meeting-service
        annotations:
          summary: "Legacy writes rejected in the last hour"
          description: "Informational once legacy retirement starts; before that, any rejection is unexpected."
          runbook_url: "docs/phase2-certification/14-operational-runbook.md#migration-mismatch"
