# Alertmanager routing for CF Meet alerts (SEC-016, backend gap audit P1).
#
# DEPLOYED to production by the coordinated release (`release` and `deploy-monitoring`
# operations, infra/calling/production/monitoring_stack.py) as the container
# cfmeet-alertmanager on the private network.
#
# Receivers are driven by secrets, never by values in this file. The release workflow
# writes the GitHub environment secret CFMEET_ALERT_WEBHOOK_URL (generic Alertmanager
# webhook JSON) and, optionally, CFMEET_ALERT_SLACK_WEBHOOK_URL (a Slack-compatible
# incoming webhook) to root-owned files on the VPS; they are mounted read-only below
# /etc/alertmanager/secrets and read through *_file fields. When a secret is unset its
# integration is removed from the deployed copy of this file (monitoring_stack.py
# render_alertmanager), so the stack still starts and alerts are visible in Alertmanager
# without a notification. No email integration is configured.
#
# scripts/monitoring/check_alert_rules.py rejects URLs and literal keys, tokens or
# passwords in this file, comments included. Validated in CI with amtool check-config
# (.github/workflows/service-boundaries.yml), with and without the integrations.

global:
  resolve_timeout: 5m

route:
  receiver: operations
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: pager
      repeat_interval: 1h
    - matchers: ['severity="warning"']
      receiver: operations
    - matchers: ['severity="info"']
      receiver: info-only
      repeat_interval: 24h

# A critical alert silences the warning and info notifications of the same alert name and
# service while it fires.
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity=~"warning|info"']
    equal: [alertname, service]
  - source_matchers: ['severity="warning"']
    target_matchers: ['severity="info"']
    equal: [alertname, service]

receivers:
  # CRITICAL: page the operators.
  - name: pager
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alert-webhook-url
        send_resolved: true
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alert-slack-webhook-url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }} Runbook: {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'

  # WARNING and anything without a severity: the operations channel.
  - name: operations
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/alert-webhook-url
        send_resolved: true
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alert-slack-webhook-url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.service }})'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }} Runbook: {{ .Annotations.runbook_url }}{{ "\n" }}{{ end }}'

  # INFO: visible in Alertmanager only, no notification.
  - name: info-only
