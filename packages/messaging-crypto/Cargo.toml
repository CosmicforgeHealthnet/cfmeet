[package]
name = "cf-messaging-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "CF Meet Messaging cryptographic core: MLS 1.0 (RFC 9420) KeyPackage validation and device-binding formats, RFC 9162 Merkle key-transparency proofs, and (feature `client`) device key generation for client SDKs"

# Stand-alone workspace: built by its own CI and consumed as a path dependency. It never
# depends on a deployable service (scripts/service-boundaries enforces it).
[workspace]

[lib]
name = "cf_messaging_crypto"
path = "src/lib.rs"

[features]
default = []
# Client-side device cryptography: generates and holds MLS signature / HPKE PRIVATE keys.
# The Messaging backend must never enable it (services/messaging architecture test).
client = ["dep:openmls_memory_storage", "dep:chacha20poly1305", "dep:aead"]
# Browser (wasm32-unknown-unknown) builds of the client core: OpenMLS `js` (Web Crypto
# randomness and time) and the same for both getrandom lines in the graph (0.4: the MLS
# provider and HPKE; 0.2: the attachment cipher's `aead`).
web = ["client", "openmls/js", "dep:getrandom02", "getrandom/wasm_js"]

[dependencies]
# MLS 1.0 (RFC 9420). Pinned exactly: every bump is a reviewed decision (ADR 0045).
openmls = { version = "=0.9.1", default-features = false }
# The OpenMLS provider is CF Meet's own (src/provider.rs): only the accepted suite's
# primitives, on RustCrypto crates. It replaced openmls_rust_crypto /
# openmls_basic_credential 0.6.0, whose P-256 / P-384 support links crypto-bigint 0.5
# (RUSTSEC-2026-0387).
openmls_traits = "=0.6.0"
# The in-memory key / group store the former provider embedded (feature `client`).
openmls_memory_storage = { version = "=0.6.0", optional = true }
# RFC 9180 HPKE with the RustCrypto backend (0.8: elliptic-curve 0.14 / crypto-bigint 0.7).
hpke-rs = { version = "=0.8.0", default-features = false, features = ["hazmat", "std"] }
hpke-rs-crypto = { version = "=0.8.0", default-features = false }
hpke-rs-rust-crypto = { version = "=0.8.0", default-features = false, features = ["std"] }
ed25519-dalek = "2"
hmac = "0.12"
hkdf = "0.12"
tls_codec = { version = "0.5", features = ["derive"] }
getrandom = "0.4"
zeroize = "1"
sha2 = "0.10"
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
thiserror = "2"
# Client-side attachment encryption (feature `client`): XChaCha20-Poly1305 in the STREAM
# construction of RustCrypto `aead`.
chacha20poly1305 = { version = "0.10", optional = true }
aead = { version = "0.5", features = ["stream", "getrandom"], optional = true }
uuid = "1"

[dev-dependencies]
# Reads the RFC 9420 published test vectors (tests/rfc9420_vectors.rs).
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
