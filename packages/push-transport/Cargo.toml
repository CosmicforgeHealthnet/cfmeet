[package]
name = "cf-push-transport"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false
description = "CF Meet push transport (Notification Service roadmap N4): the APNs (token-based), FCM HTTP v1 and Web Push (RFC 8030 / 8291 / 8292) adapters, moved verbatim out of Messaging with their tests. Metadata-only payloads, SSRF host allowlist for Web Push endpoints, constant-time signing. Used by Messaging until Phase 4.1, then by the unified Notification Service only."

# Stand-alone workspace: consumed by deployable services as a path dependency. It never
# depends on any deployable service and carries no business vocabulary beyond the push
# metadata keys it refuses to widen.
[workspace]

[lib]
name = "cf_push_transport"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hmac = "0.12"
# p256 0.14 (elliptic-curve 0.14 / crypto-bigint 0.7): 0.13 links crypto-bigint 0.5
# (RUSTSEC-2026-0387). `getrandom`: key generation from the OS RNG.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "pem", "std", "getrandom"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "sync"] }
