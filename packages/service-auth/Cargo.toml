[package]
name = "cf-service-auth"
version = "0.1.0"
edition = "2021"
publish = false
description = "CF Meet internal service authentication: Ed25519-signed service tokens, receiver-authoritative trust policy, delegated platform context and request/correlation binding"

# Stand-alone workspace: this package is built by its own CI and consumed by deployable
# services as a path dependency. It never depends on any deployable service.
[workspace]

[lib]
name = "cf_service_auth"
path = "src/lib.rs"

[[bin]]
name = "cf-service-keygen"
path = "src/bin/cf-service-keygen.rs"

[features]
default = []
# Authenticated internal HTTP client (reqwest, rustls, no redirects).
client = ["dep:reqwest", "dep:url"]

[dependencies]
# Audited JOSE/JWS implementation WITHOUT a bundled crypto backend: `src/jwt.rs` installs
# a provider with only EdDSA (ed25519-dalek) and HMAC-SHA2 (hmac / sha2). The bundled
# `rust_crypto` backend would also link RSA / P-256 / P-384 (RUSTSEC-2026-0387).
jsonwebtoken = { version = "11", default-features = false }
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde"] }
secrecy = "0.10"
zeroize = "1.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
uuid = { version = "1", features = ["serde", "v4"] }
jsonschema = { version = "0.58", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
