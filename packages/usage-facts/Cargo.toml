[package]
name = "cf-usage-facts"
version = "0.1.0"
edition = "2021"
publish = false
description = "CF Meet Part VI unified usage facts: the provider-independent fact model, its catalogue (usage types, units, producers, allowed dimensions), the canonical payload digest, validation, and (feature `exporter`) the durable producer-side exporter to the Developer Platform"

# Stand-alone workspace: consumed by deployable services as a path dependency. It never
# depends on any deployable service and carries no price, rate or billing vocabulary.
[workspace]

[lib]
name = "cf_usage_facts"
path = "src/lib.rs"

[features]
default = []
# Producer-side exporter: event and interval sources, watermark-driven durable export and
# shadow reconciliation over service-authenticated internal HTTP.
exporter = ["dep:cf-service-auth", "dep:tokio", "dep:tracing", "dep:async-trait"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
uuid = { version = "1.11", features = ["serde"] }
cf-service-auth = { path = "../service-auth", features = ["client"], optional = true }
tokio = { version = "1.42", features = ["time"], optional = true }
tracing = { version = "0.1", optional = true }
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.11", features = ["serde", "v4"] }
